name: Restart

# Owner request (2026-10-16, "everything stays productive"): a bot run that dies mid-job (runner lost, timeout,
# usage cap, a crash in the action) used to sit dead until the hourly CEO planner noticed it. This re-runs the failed
# or cancelled jobs of a Claude, Pipeline or Kickoff run once, at once, with no model:
#   - Pipeline fix/review: the re-run re-checks the head first. If the dead run had already pushed, the new head's CI
#     drives the next step instead (and the re-run skips); otherwise it starts again on the branch as it stands. A re-run
#     reuses the fix-round marker of attempt 1, so a dead run costs no extra round.
#   - Kickoff build: the build prompt continues an existing claude/issue-N-<run id> branch (the id is the same on a
#     re-run) instead of starting over.
#   - Claude (@claude/@sonnet): claude-code-action runs the same comment again.
# Only attempt 1 is re-run, so each run gets at most one automatic restart; a second death is left to the planner.
# A run started with GITHUB_TOKEN sends no workflow_run event (Kickoff started by ci.yml, CI on main started by
# auto-merge), so the schedule also looks every 15 min for an attempt-1 Kickoff or main CI run that ended badly in the
# last 90 min. A main CI re-run that passes then starts Kickoff. It also brings main into claude/ PRs that conflict,
# and starts the review of a claude/ PR whose head is green with no review yet (CI that kickoff dispatched with
# GITHUB_TOKEN, e.g. on a PR kickoff opened itself, sends no workflow_run to pipeline.yml).
# For an open claude/ PR whose head's CI died before any test ran (a setup step: checkout, setup-node, npm ci, or a lost
# runner), it re-runs that CI's failed jobs once and says so on the PR; a test failure is never re-run.

on:
  workflow_run:
    workflows: [Claude, Pipeline, Kickoff]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  # GitHub ran the cron about once per 3 h in 0.6 (10 of ~96 a day), so Build Pipeline's 20-min PR check also
  # dispatches this sweep while anything is open (Kaizen (Gale), 0.6 scorecard, 2026-10-18).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    if: |
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
      issues: write
      checks: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const BAD = ['failure', 'cancelled', 'timed_out'];
            const recent = async (q) => (await github.rest.actions.listWorkflowRuns({ owner, repo, status: 'completed', per_page: 30, ...q })).data.workflow_runs
              // Not "cancelled": a Kickoff pick job dropped while pending (concurrency) ends that way and needs no re-run.
              .filter((r) => r.run_attempt === 1 && ['failure', 'timed_out'].includes(r.conclusion) && Date.now() - Date.parse(r.updated_at) < 90 * 60e3);
            const runs = (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch')
              ? [...await recent({ workflow_id: 'kickoff.yml' }), ...await recent({ workflow_id: 'ci.yml', branch: 'main' })]
              : [context.payload.workflow_run];
            for (const wr of runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: wr.id, per_page: 100 });
              const dead = jobs.filter((j) => BAD.includes(j.conclusion)).map((j) => j.name);
              if (!dead.length) { core.info(`${wr.name} run ${wr.id}: no failed job to re-run`); continue; }
              // A re-run uses the workflow file of the dead run, so kickoff's newer "skip if closed" step can't stop it:
              // don't re-run a Kickoff run whose failed builds are all for closed issues (2026-10-17: #202 built twice).
              const builds = dead.map((n) => (n.match(/^build \((\d+),/) || [])[1]).filter(Boolean).map(Number);
              if (wr.name === 'Kickoff' && builds.length === dead.length) {
                const open = [];
                for (const n of builds) if ((await github.rest.issues.get({ owner, repo, issue_number: n })).data.state === 'open') open.push(n);
                if (!open.length) { core.info(`Kickoff run ${wr.id}: failed builds are for closed issues (${builds.map((n) => '#' + n).join(', ')}); not re-run`); continue; }
              }
              try { await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: wr.id }); }
              catch (e) { core.warning(`${wr.name} run ${wr.id}: re-run failed: ${e.message}`); continue; }
              core.notice(`re-running ${dead.join(', ')} of ${wr.name} run ${wr.html_url} (attempt 2 of 2)`);
            }
            // A claude/ PR that conflicts with main gets no CI (GitHub runs none on a conflicting PR), so nothing ever
            // wakes for it. Kickoff's refresh only sees PRs open at merge time: P4b's PR #177 opened 8 min after the
            // merge it conflicted with and had no CI until someone noticed (2026-10-17). Start pipeline step=merge for it; pipeline runs at most
            // one merge per PR per main commit, so this repeats nothing.
            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const all = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 }))
                .filter((p) => !p.draft && /^claude\//.test(p.head.ref));
              // PR CI that died before any test ran (coordinator OK 2026-10-22T04:10Z): #818's data job died in `npm ci` and
              // ci-ok sat red for an hour, since this sweep only re-ran Kickoff and main CI. An attempt-1 CI run on the PR's
              // head whose every dead job (ci-ok aside, it only reports the others) stopped in a setup step is re-run once.
              // A failure inside a test step is never re-run; it is the fix round's. Each re-run is logged (a notice here and
              // a comment on the PR), so a recurring `npm ci` death stays visible.
              // INFRA-DEATH START (tests/automerge.mjs runs this block)
              const SETUP = /^(Set up job|Run actions\/(checkout|setup-node|cache)@\S+|Run npm ci)$/;
              const infraDeath = (jobs) => {
                const dead = jobs.filter((j) => ['failure', 'cancelled', 'timed_out'].includes(j.conclusion) && j.name !== 'ci-ok');
                if (!dead.length) return null;
                const at = [];
                for (const j of dead) {
                  const s = (j.steps || []).find((x) => x.conclusion !== 'success' && x.conclusion !== 'skipped');
                  if (!s || !SETUP.test(s.name)) return null;
                  at.push(`${j.name} (${s.name}: ${s.conclusion || 'runner lost'})`);
                }
                return at;
              };
              // INFRA-DEATH END
              for (const p of all.filter((x) => !x.labels.some((l) => l.name === 'stuck'))) {
                const sha = p.head.sha;
                const ciRuns = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 10 })).data.workflow_runs;
                const lastCi = ciRuns.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
                if (lastCi && lastCi.status === 'completed' && lastCi.run_attempt === 1 && BAD.includes(lastCi.conclusion)) {
                  const died = infraDeath(await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: lastCi.id, per_page: 100 }));
                  if (died) {
                    try {
                      await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: lastCi.id });
                      core.notice(`#${p.number}: CI run ${lastCi.html_url} died before any test (${died.join('; ')}); re-ran its failed jobs (attempt 2 of 2)`);
                      await github.rest.issues.createComment({ owner, repo, issue_number: p.number,
                        body: `Restart: CI on ${sha.slice(0, 7)} died before any test ran (${died.join('; ')}); re-ran its failed jobs once (${lastCi.html_url}). A second death goes to this PR's owner.` });
                    } catch (e) { core.warning(`#${p.number}: CI re-run failed: ${e.message}`); }
                    continue;
                  }
                }
              }
              const open = all.filter((p) => !p.labels.some((l) => ['hold', 'stuck'].includes(l.name)));
              for (const p of open) {
                const pr = (await github.rest.pulls.get({ owner, repo, pull_number: p.number })).data;
                if (pr.mergeable_state === 'dirty') {
                  await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pipeline.yml', ref: 'main', inputs: { pr: String(p.number), step: 'merge' } });
                  core.notice(`#${p.number} conflicts with main: started pipeline step=merge`);
                  continue;
                }
                const sha = pr.head.sha;
                // Green head, no review of it, and no Pipeline run going: the review event was lost (a GITHUB_TOKEN CI run).
                const ok = (await github.rest.checks.listForRef({ owner, repo, ref: sha, check_name: 'ci-ok' })).data.check_runs
                  .some((c) => c.conclusion === 'success');
                if (!ok) continue;
                const reviewed = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: p.number, per_page: 100 }))
                  .some((c) => c.user && c.user.login === 'claude[bot]' && (c.body || '').includes(`Review of ${sha.slice(0, 7)}`));
                if (reviewed) continue;
                // At most one such start per head: a review that died without its comment is left to the planner.
                const headAt = Date.parse((await github.rest.repos.getCommit({ owner, repo, ref: sha })).data.commit.committer.date);
                const tried = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'pipeline.yml', event: 'workflow_dispatch', per_page: 50 })).data.workflow_runs
                  .some((r) => r.display_title === `Pipeline review #${p.number}` && Date.parse(r.created_at) >= headAt);
                if (tried) { core.info(`#${p.number}: a review of ${sha.slice(0, 7)} was already started and left no comment; left for the planner`); continue; }
                // BUSY-CHECK START (tests/automerge.mjs runs this block)
                // Only a Pipeline run for this PR holds the start back. Any going run used to, and with a comment-triggered run on
                // some PR nearly always going, #655 sat green and unreviewed for an hour (2026-10-20). A dispatched run names its PR
                // ("Pipeline <step> #<n>"); an event run is "Pipeline" until its run job ("run #<n> (<model>)") exists, so one
                // still deciding counts as busy (it ends in seconds).
                const GOING = ['queued', 'in_progress', 'waiting', 'pending'];
                const busyFor = async (n, runs, jobsOf) => {
                  for (const r of runs.filter((x) => GOING.includes(x.status))) {
                    const d = r.display_title.match(/^Pipeline \S+ #(\d+)$/);
                    if (d) { if (+d[1] === n) return true; continue; }
                    const jobs = await jobsOf(r.id);
                    const run = jobs.find((j) => /^run\b/.test(j.name));
                    if (!run || run.name.includes(`#${n} `)) return true;
                  }
                  return false;
                };
                // BUSY-CHECK END
                const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'pipeline.yml', per_page: 20 })).data.workflow_runs;
                const jobsOf = async (id) => (await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: id })).data.jobs;
                if (await busyFor(p.number, runs, jobsOf)) { core.info(`#${p.number}: green and unreviewed, but a Pipeline run for it is going; next sweep`); continue; }
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pipeline.yml', ref: 'main', inputs: { pr: String(p.number), step: 'review' } });
                core.notice(`#${p.number}: head ${sha.slice(0, 7)} is green with no review: started pipeline step=review`);
              }
            }
