name: Kickoff

# Owner request (2026-10-16): when a merge lands and there is room, start the next planned item at once instead of
# waiting for the hourly CEO planner. The planner still decides WHAT comes next: it keeps a queue in the "Next up"
# section of the state issue (#114, "CEO pipeline state"), one line per item, each with a ready spec in its issue:
#   - [next] #127 sonnet lanes:app.css         a build on issue #127 with Sonnet that edits src/styles/app.css
#   - [next] #130 opus lanes:golden,main.js    an Opus build that re-records golden and edits src/main.js
#   - [next] #131 sonnet lanes:none            touches no serial file (docs, research)
#   - [next] #128 opus alone      "alone": starts only when nothing else is in flight, and nothing starts beside it
# Lanes are the serial files of docs/team/DISPATCH.md (owner, 2026-10-16: plan to avoid failed or redone runs). An item
# starts only when no in-flight item shares a lane with it; otherwise kickoff skips to the next queued item that
# doesn't overlap. In-flight lanes come from each open PR's changed files plus the lanes on its started line.
# This workflow (no model for the choice) runs after CI on main goes green (that is, after every merge, since
# auto-merge dispatches CI on main and ci.yml then dispatches this), or by hand. It counts what is in flight (open claude/ PRs plus "[started ...]"
# lines; a started line whose issue is closed is dropped, one with no PR after 9 h becomes "[stalled ...]", one whose build posted Blocked:/Needs @claude becomes "[blocked ...]"), starts queued items from the top until 3 are in flight, and rewrites each started line to
# "- [started <time>] #N model" so neither the planner nor a second run starts it again. The build run implements the
# issue on a new claude/ branch and opens the PR; pipeline.yml and auto-merge.yml take it from there.

# Started by the kickoff job of ci.yml after each green CI run on main (a workflow_run trigger here never fired: see
# that job), or by hand.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The main commit CI just passed (set by ci.yml; it makes the refresh job run). Empty by hand.
        required: false
        default: ''

permissions:
  contents: read

# Serialized per job, not per run: with a run-level group a second kickoff (after the next merge) waited until every
# build of the first run had finished (30-90 min), so nothing new started in that time (seen 2026-10-17).
jobs:
  pick:
    concurrency:
      group: kickoff-pick
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      items: ${{ steps.p.outputs.items }}
      touches: ${{ steps.p.outputs.touches }}
    steps:
      - id: p
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // 3 under the owner's usage budget (2026-10-20 5:17 PM ET; fixed until the next minor's usage reading, 1 if that
            // reading is over the line). Was 5 from 2026-10-17 (Max 20x plan) and 8 for the 0.8 overnight run. Lanes still apply.
            const STATE = 114, MAX = 3;
            // What Sonnet may not change: one list for this routing and every Sonnet prompt (Kaizen (Gale), 2026-10-20).
            const ROUTE = JSON.parse(Buffer.from((await github.rest.repos.getContent({ owner, repo, path: '.github/routing/opus-paths.json', ref: 'main' })).data.content, 'base64').toString('utf8'));
            core.setOutput('touches', ROUTE.sonnetMayNotTouch);
            // Words that mean a spec changes what gen compiles, so it needs the gen lane (Kaizen (Gale), 2026-10-20).
            const GEN = JSON.parse(Buffer.from((await github.rest.repos.getContent({ owner, repo, path: '.github/routing/gen-lane.json', ref: 'main' })).data.content, 'base64').toString('utf8'));
            const LANES = ['golden', 'golden-nextup', 'golden-journey', 'golden-milestones', 'golden-regional', 'golden-route', 'mig', 'main.js', 'gates', 'gen', 'app.css', 'ci', 'a11y', 'release', 'architecture'];
            // OPUS-FILES START (tests/kickoff.mjs runs this block)
            // PIP-06 (Kaizen (Gale), 0.7 rules audit, 2026-10-19): a Sonnet build whose issue's "## Files" section names an
            // Opus path (#114 Effort: src/core, saves/storage/migrations, gates, golden/mig1, tools/gen, data/schema,
            // workflows) stopped with "Needs @claude (Opus)" and was built again. Such an item starts on Opus instead.
            // The paths come from .github/routing/opus-paths.json (ROUTE), the list the Sonnet prompts stop on.
            const OPUS_PATH = new RegExp(ROUTE.paths.map((p) => p.re).join('|'));
            // A spec names its parts as "## Files" headings (before 0.8) or as "- **Files.**" bullets (docs/plans/SPEC-TEMPLATE.md).
            // PIP-06 read only the heading, so #509's bullet naming tools/gen/gen.mjs started on Sonnet (#221, 2026-10-20 1:24 AM ET).
            const specField = (body, name) => {
              const b = body || '';
              const h = b.match(new RegExp(`^## ${name}\\b[^\\n]*\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))`, 'm'));
              if (h) return h[1];
              const f = b.match(new RegExp(`^- \\*\\*${name}[.:]?\\*\\*[.:]?([\\s\\S]*?)(?=^- \\*\\*|^## |(?![\\s\\S]))`, 'm'));
              return f ? f[1] : '';
            };
            // No readable Files list means nobody checked the paths, so it starts on Opus too (Kaizen (Gale), 2026-10-20).
            const opusPath = (body) => {
              const files = specField(body, 'Files');
              if (!/[\w-]\/|\w\.\w/.test(files)) return 'no readable Files list';
              return (files.match(OPUS_PATH) || [])[0] || null;
            };
            // Kaizen (Gale), 2026-10-20 (#221 1:24 AM ET: #509 needed a gen run and a golden re-record and was routed to Sonnet,
            // whose limits stopped it): work on the gen or a golden lane, or a spec that runs `npm run gen` or re-records
            // golden, starts on Opus whatever its tier. So does the architecture lane (module layout, a performance budget; FLOW-23,
            // Gus 2026-10-21): src/*.js stays off the Opus paths, since most src changes are small UI fixes Sonnet does well.
            const opusWork = (lanes, body) => {
              const l = [...lanes].find((x) => x === 'gen' || x === 'architecture' || /^golden(-|$)/.test(x));
              if (l) return `lane ${l}`;
              return ((body || '').match(/npm run gen\b|re-?record\w*[^.\n]{0,20}\bgolden|\bgolden[^.\n]{0,20}re-?record\w*/i) || [])[0] || null;
            };
            // Kaizen (Gale), 2026-10-20 (#221 1:22 AM ET: #502 named inputs only in /mnt/project-files, which builds can't read,
            // and sat 67 min): a /mnt/ path anywhere in the spec, an input outside the repo (`~/…`, `/…`), or an input path main
            // doesn't have keeps the item queued but not started. Inputs come from the spec's "- **Inputs.**" bullet or an
            // "Inputs: a, b" line in "## Lanes, model, order" (Release Planner (Walter)); "Inputs: none" names none.
            const inputPaths = (body) => {
              // A "`<path>` — not needed: <reason>" entry (PLAN-INPUTS below) lists a plan path the build doesn't read: not an input.
              const b = (body || '').replace(/`[^`\s]+`\s*(?:—|–|-{1,2})\s*not needed:[^\n]*/gi, '');
              const ticks = (t) => [...t.matchAll(/`([^`\s]+)`/g)].map((m) => m[1]);
              // The bullet is prose, so only its backticked paths count; a bare "Inputs: a, b" line may list them plain.
              const lineTokens = [...b.matchAll(/^Inputs?:[ \t]*([^\n]*)$/gm)].flatMap((m) => (ticks(m[1]).length ? ticks(m[1]) : m[1].split(/[,\s]+/)));
              const named = [...ticks(specField(b, 'Inputs?')), ...lineTokens].map((x) => x.replace(/[.;]+$/, '')).filter((x) => x.includes('/'));
              const outside = named.filter((x) => /^[~/]/.test(x));
              // A No-gos bullet may name /mnt/ to forbid it ("never read /mnt/…"); that is not an input.
              const nogo = specField(b, 'No-gos'), scan = nogo ? b.replace(nogo, '') : b;
              // Kaizen (Gale), 2026-10-20 (#221 1:20 PM ET: #502's P13 named Metabot's marker without a repo path, so the hold
              // above had nothing to look up and the build stopped): every Inputs entry names a repo path, says "none", or
              // names an After key (a research item that runs first). The "Inputs:" line is a list, split on , or ; outside
              // parentheses, and each entry is checked; the bullet is prose, so it is one entry (#509's names `data/packs/**`
              // and then explains in words).
              const afterKeys = ticks(specField(b, 'After') + ' ' + ((b.match(/^After:[^\n]*$/m) || [''])[0]));
              const split = (t) => { const out = []; let d = 0, cur = '';
                for (const ch of t) { if (ch === '(') d++; if (ch === ')') d = Math.max(0, d - 1);
                  if ((ch === ',' || ch === ';') && !d) { out.push(cur); cur = ''; } else cur += ch; }
                return [...out, cur].map((x) => x.replace(/\s+/g, ' ').trim().replace(/[.]+$/, '')).filter(Boolean); };
              const prose = specField(b, 'Inputs?').replace(/\s+/g, ' ').trim().replace(/[.]+$/, '');
              const entries = [...(prose ? [prose] : []), ...[...b.matchAll(/^Inputs?:[ \t]*([^\n]*)$/gm)].flatMap((m) => split(m[1]))];
              const bare = entries.filter((e) => !/^none\b/i.test(e) && !/[\w.*~-]\/|\/[\w.*-]/.test(e) && !ticks(e).some((k) => afterKeys.includes(k)));
              return {
                mnt: [...new Set([...(scan.match(/\/mnt\/[^\s`'")\]]+/g) || []).map((x) => x.replace(/[.,;:]+$/, '')), ...outside.filter((x) => !x.startsWith('/mnt/'))])],
                repo: [...new Set(named.filter((x) => !/^[~/]/.test(x)))],
                bare: [...new Set(bare)],
              };
            };
            // Kaizen (Gale), 2026-10-20 (spec-incomplete-files three times today: #501, #504, and #503, whose PR #565 touched
            // tools/gen on lanes build-card,a11y,rows): a spec whose Result names data/, or that adds a pack field or moves game
            // facts into data/, changes what gen compiles, so its Lanes must include gen. The words are in .github/routing/gen-lane.json (GEN).
            const genLaneMiss = (lanes, body) => {
              if ([...lanes].includes('gen')) return null;
              const hit = GEN.keywords.find((k) => new RegExp(k.re, 'im').test(k.in.map((f) => specField(body, f)).join('\n')));
              return hit ? hit.says : null;
            };
            // The part of a path before its first glob segment, so `src/assets/icons/*` is looked up as src/assets/icons.
            const lookupPath = (p) => { const segs = p.split('/'), k = segs.findIndex((x) => /[*?{[]/.test(x)); return (k < 0 ? segs : segs.slice(0, k)).filter(Boolean).join('/'); };
            // OPUS-FILES END
            // PLAN-INPUTS START (tests/kickoff.mjs runs this block)
            // Kaizen (Gale), 2026-10-21 (PROCESS REVIEW OK, fresh-governance-review verdicts "spec-inputs-check"): #644's
            // plan was amended in #687 (a new input `docs/design/0.9-keys-macro.md`, a new After key `research-skill-bar`)
            // but its issue was not, so its 04:28Z build started without them and stopped. The plan text is the issue's
            // "Plan: `docs/plans/…md` §Pn" section (the whole file if it names no section) plus any ROADMAP row linking it as
            // "[Pn](that file)". Every repo path in it (backticked, or a repo-relative link) must be in the spec's Inputs or
            // Files, or written in the spec as "`<path>` — not needed: <reason>"; every key in its After line and every
            // research-* key in it must be in the spec's After or Inputs. Otherwise kickoff holds the item and names each gap.
            const planRef = (body) => {
              const m = (body || '').match(/\bplan:?\s+`(docs\/plans\/[^`\s]+\.md)`(?:\s*§\s*([\w.]+))?/i);
              return m ? { file: m[1], sec: m[2] || '' } : null;
            };
            const planSection = (text, sec) => {
              if (!sec) return text || '';
              const esc = sec.replace(/[.]/g, '\\.');
              const h = (text || '').match(new RegExp(`^## ${esc}(?=[:\\s])[^\\n]*\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))`, 'm'));
              return h ? h[0] : null;
            };
            const roadmapRows = (roadmap, ref) => (roadmap || '').split('\n').filter((l) => /^\|/.test(l) &&
              (ref.sec ? l.includes(`[${ref.sec}](${ref.file})`) : l.includes(`](${ref.file})`))).join('\n');
            const normPath = (p) => p.replace(/[.,;:]+$/, '').replace(/\/+$/, '');
            // Repo paths only (fresh review of #720, 8c18892): a `:line` anchor is dropped, a token counts only when its first
            // segment is a top-level entry on main (`tops`; so not Ctrl/Alt, 1/45 or daevacompanion.com/…), and a link is
            // resolved against the directory of the file it is in (`base`; '' for ROADMAP, which sits at the root).
            const joinPath = (base, rel) => { const out = [];
              for (const seg of [...(base ? base.split('/') : []), ...rel.split('/')]) {
                if (seg === '..') out.pop(); else if (seg && seg !== '.') out.push(seg); }
              return out.join('/'); };
            const planPaths = (text, base, tops) => {
              const web = (x) => /[<>]/.test(x) || /^(?:[~/]|[a-z][\w+.-]*:)/i.test(x);
              const t = [...(text || '').matchAll(/`([^`\s]+)`/g)].map((m) => m[1]).filter((x) => !web(x));
              const links = [...(text || '').matchAll(/\]\(([^)\s#]+)(?:#[^)]*)?\)/g)].map((m) => m[1]).filter((x) => !web(x)).map((x) => joinPath(base, x));
              return [...new Set([...t, ...links].filter((x) => x.includes('/')).map((x) => normPath(x.replace(/:\d+(?:-\d+)?$/, '')))
                .filter((x) => tops.has(x.split('/')[0])))];
            };
            const notNeeded = (body) => [...(body || '').matchAll(/`([^`\s]+)`\s*(?:—|–|-{1,2})\s*not needed:\s*([^\n]+)/gi)]
              .map((m) => ({ path: normPath(m[1]), why: m[2].trim() }));
            const planGaps = (body, plan, rows, tops) => {
              const text = [plan || '', rows || ''].join('\n'), ref = planRef(body);
              const dir = ref ? ref.file.split('/').slice(0, -1).join('/') : '';
              const ins = inputPaths(body), nn = notNeeded(body);
              const tick = (t) => [...(t || '').matchAll(/`([^`\s]+)`/g)].map((m) => m[1]);
              const have = new Set([...ins.repo, ...ins.mnt, ...tick(specField(body, 'Files')), ...nn.map((x) => x.path), ...(planRef(body) ? [planRef(body).file] : [])].map(normPath)); // the plan file itself is not an input
              const afterOf = (t) => specField(t, 'After') + ' ' + ((t.match(/^After:[^\n]*$/m) || [''])[0].replace(/^After:/, ''));
              const keysIn = (t) => [...t.matchAll(/\b((?:research|owner-ok|owner-check|owner)-[\w.-]*\w)/g)].map((m) => m[1]);
              const keys = new Set([...keysIn(afterOf(body || '')), ...keysIn(specField(body, 'Inputs?')), ...tick(specField(body, 'Inputs?'))]);
              const want = [...new Set([...keysIn(afterOf(plan || '')), ...[...text.matchAll(/\b(research-[\w.-]*\w)/g)].map((m) => m[1])])];
              return {
                paths: [...new Set([...planPaths(plan, dir, tops), ...planPaths(rows, '', tops)])].filter((p) => !have.has(p)),
                keys: want.filter((k) => !keys.has(k)),
                notNeeded: nn,
              };
            };
            // PLAN-INPUTS END
            let roadmapText = null, repoTops = null;
            // Keep in step with lanes() in the refresh job below (same rules, two copies).
            const lanesOfFiles = (files) => {
              const out = new Set();
              for (const f of files) {
                const n = f.filename, patch = f.patch || '';
                // Snapshots live per card folder since 0.4 P4e, so each folder is its own lane; anything else under
                // tests/golden (golden.js, states.js, _state/) is the whole golden lane (0.6 kaizen K9, #222).
                const gf = n.match(/^tests\/golden\/snapshots\/([a-z][a-z0-9-]*)\//);
                if (gf) out.add(`golden-${gf[1]}`); else if (/^tests\/golden\//.test(n)) out.add('golden');
                if (/^tests\/e2-migtest/.test(n) || /mig1/.test(patch)) out.add('mig');
                if (n === 'src/main.js') out.add('main.js');
                if (/^data\//.test(n) && /"(requires|completesWith|is)"/.test(patch)) out.add('gates');
                if (/^tools\/gen\//.test(n)) out.add('gen');
                if (n === 'src/styles/app.css') out.add('app.css');
                if (n === '.github/workflows/ci.yml') out.add('ci');
                if (n === 'tests/a11y.js') out.add('a11y');
                if (n === 'package.json' || n === 'CHANGELOG.md') out.add('release');
              }
              return out;
            };
            const lanesOfLine = (l) => { const m = l.match(/ lanes:([^\s]+)/); return new Set(m ? m[1].split(',').filter((x) => x && x !== 'none') : []); };
            // Lanes clash when equal, and the whole `golden` lane clashes with every per-folder `golden-<card>` lane.
            const clash = (x, y) => x === y || (x === 'golden' && y.startsWith('golden-')) || (y === 'golden' && x.startsWith('golden-'));
            const overlap = (a, b) => [...a].some((x) => [...b].some((y) => clash(x, y)));
            core.setOutput('items', '[]');
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: STATE })).data;
            const body = issue.body || '';
            let lines = body.split('\n');
            const prs = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 }))
              .filter((p) => /^claude\//.test(p.head.ref));
            const refs = prs.map((p) => p.head.ref);
            const busy = new Set();
            for (const p of prs) for (const x of lanesOfFiles(await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: p.number, per_page: 100 }))) busy.add(x);
            // A started item whose issue is now closed (its PR merged) is done: drop its line so it stops counting.
            // One with no PR 9 h after it started (blocked, handed to Opus, failed or timed out; 9 h covers a 4 h build plus
            // its one Restart re-run) is marked "stalled"
            // so it frees its slot; the planner reads why and re-queues it or raises a To-do.
            let pruned = false;
            const kept = [], stalled = [];
            for (const l of lines) {
              const s = l.match(/^- \[started ([^\]]*)\] #(\d+)(.*)$/);
              if (s) {
                const n = Number(s[2]);
                if ((await github.rest.issues.get({ owner, repo, issue_number: n })).data.state === 'closed') { pruned = true; continue; }
                const hasPr = refs.some((r) => r.startsWith(`claude/issue-${n}-`));
                // A build that ended with "Blocked:" or "Needs @claude" on its issue holds no runner, so it frees its slot
                // now (2026-10-17: 0.5 P1 was Blocked at 09:21Z and kept P20 waiting until the 2 h planner rule).
                if (!hasPr && (await github.rest.issues.listComments({ owner, repo, issue_number: n, since: new Date(Date.parse(s[1])).toISOString(), per_page: 100 })).data
                  .some((c) => c.user && c.user.login !== 'github-actions[bot]' && /^(Blocked:|Needs @claude)/.test(c.body || ''))) {
                  kept.push(`- [blocked ${s[1]}] #${n}${s[3]}`); pruned = true;
                  continue;
                }
                if (!hasPr && Date.now() - Date.parse(s[1]) > 9 * 3600e3) {
                  kept.push(`- [stalled ${s[1]}] #${n}${s[3]}`); pruned = true; stalled.push(n);
                  continue;
                }
              }
              kept.push(l);
            }
            lines = kept;
            // Auto-queue (2026-10-17: after P3c merged nothing was queued until the hourly planner ran, so 0.4 sat idle).
            // An open item issue titled "<minor> <key>: ..." (e.g. "0.4 P2b: ...", or "Release 0.4.0 ..." / "0.8 R: ..." as key R;
            // "0.8 R: Release 0.8.0" was unkeyed, so its "After: everything" could never be met, #517 review 2026-10-19) whose body holds its own queue line
            // ("- [next] #N ...") is queued here once every key on its "After:" line names a closed item of the same
            // minor. "After: everything" waits for all other items of the minor. A `research-<slug>` key is met once a file
            // whose name contains <slug> is in docs/research/ on main (2026-10-17: P9 sat idle 47 min after its research
            // PR merged, the 4th not-queued stall that day; #221, #222). A key that matches no item (or an After line
            // that can't be read) leaves it for the planner. An `owner-ok-<x>` key is met once docs/DECISIONS.md on main has a
            // table row naming `owner-ok-<x>` in its Topic cell (the keys the row clears; a "Not covered: ..." mention in the
            // Decision cell doesn't count) whose decision starts "Owner, typed" (Isaac's own words, recorded by a reviewed
            // PR; #114 "Owner tokens"). 2026-10-17: P2, P12, P14 and P15 sat unqueued after their OK was recorded (#221 x3).
            // From 0.7 on the key is `owner-ok-<minor>-<slug>` (patch items `owner-ok-<x.y.z>-<slug>`; K12, afterBlocker below).
            const allIssues = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 }))
              .filter((i) => !i.pull_request);
            const items = allIssues
              .map((i) => ({ i, m: i.title.match(/^(\d+\.\d+) (P\d+[a-z]?|S\d+|R):/) || (i.title.match(/^Release (\d+\.\d+)\.0\b/) || []).concat('R').slice(0, 3) }))
              .filter((x) => x.m.length === 3)
              .map(({ i, m }) => ({ n: i.number, ver: m[1], rel: m[1], key: m[2], open: i.state === 'open', body: i.body || '' }));
            const keyed = new Map(items.map((x) => [`${x.ver} ${x.key}`, x]));
            // Patch items ("0.6.1 F5: ...") have no minor key; a patch release's "After: everything" means all of them.
            const patch = allIssues.map((i) => ({ i, m: i.title.match(/^(\d+\.\d+\.\d+) ([A-Za-z]+\d+[a-z]?):/) }))
              .filter((x) => x.m).map(({ i, m }) => ({ n: i.number, rel: m[1], key: `${m[1]} ${m[2]}`, open: i.state === 'open' }));
            const listed = new Set(lines.flatMap((l) => { const q = l.match(/^- \[[^\]]+\] #(\d+)/); return q ? [Number(q[1])] : []; }));
            const queued = [];
            // AFTER-CHECK START (tests/kickoff.mjs runs this block against fixtures)
            let researchFiles = null;
            const researchDone = async (slug) => {
              if (!researchFiles) researchFiles = (await github.rest.repos.getContent({ owner, repo, path: 'docs/research', ref: 'main' })
                .then((r) => (Array.isArray(r.data) ? r.data : []).map((f) => f.name), () => []));
              return researchFiles.some((f) => f.includes(slug));
            };
            let typedOks = null;
            const ownerOk = async (key) => {
              if (!typedOks) typedOks = (await github.rest.repos.getContent({ owner, repo, path: 'docs/DECISIONS.md', ref: 'main' })
                .then((r) => Buffer.from(r.data.content, 'base64').toString('utf8').split('\n')
                  .map((l) => l.split('|').map((s) => s.trim()))
                  .filter((c) => c.length >= 5 && c[0] === '' && /^Owner, typed\b/.test(c[3])).map((c) => c[2]),
                (e) => { core.warning(`docs/DECISIONS.md could not be read (${e.message}); owner-ok keys stay unmet this run`); return []; }));
              return typedOks.some((topic) => topic.includes('`' + key + '`'));
            };
            // Why an item's "After:" line holds it ('' = met, or no After line). Used by auto-queue and, since 2026-10-18, by
            // every [next] line before it starts: a gated line put in #114 by hand used to start unmet (0.7 C1 and Y2 were
            // queued with unmet After lines at 7:32 AM ET and pulled by hand; Kaizen (Gale), #222). An issue whose title
            // names no minor (ver null, e.g. "0.6.1 F5: ...") can only use research- and owner-ok- keys.
            // K12 (Kaizen (Gale), 2026-10-18, #222): from 0.7 on an owner-ok key carries the item's own minor, or its patch for
            // a patch item (`owner-ok-0.7-sync`, `owner-ok-0.7.1-x`), and any other owner-ok key is not understood. 0.7 P6's
            // `owner-ok-S2` read as met through the 0.5 S2 row. x.rel is the version the title starts with (none: the rule
            // applies). Items before 0.7 keep their old tokens.
            const before07 = (v) => { const [a, b] = v.split('.').map(Number); return a === 0 && b < 7; };
            const afterBlocker = async (x) => {
              // Drop parenthesised notes before cutting at the first full stop: stopping at the first "(" lost every key
              // after it (0.6 P21's owner-ok-sync-hosting, P14's P9), so P21 started unmet (2026-10-18, #222).
              const am = x.body.match(/\bAfter:\s*([^\n]*)/);
              if (!am) return '';
              // A full stop ends the line's keys only when a space or the end follows: `owner-ok-0.7-sync` keeps its dots.
              // Markdown marks go first: 0.8 specs write "- **After:** `owner-ok-0.8-icon-fit`", which read as "**" and a
              // backticked key and held all 21 items at queue time (2026-10-19 9:28 PM ET).
              const after = am[1].replace(/[*`]/g, '').replace(/\([^)]*\)/g, '').split(/\.(?=\s|$)/)[0];
              const unclear = `After line "${after.trim()}" not understood`;
              let deps;
              // Whole words only: a slug like research-all-icons or owner-ok-0.8-all-classes is a key, not "everything".
              if (after.split(/[,\s]+/).some((t) => /^(?:everything|all)$/i.test(t))) {
                // A patch release ("Release 0.6.1 (patch)") waits for the issues titled with its patch version (0.6.1
                // stalled the queue on 2026-10-18: "everything" was not understood there, and an alone line stops the loop).
                // No patch items at all (none filed yet, or a typo in a title) is not understood, not "nothing to wait for".
                if (!x.ver && x.rel && /^\d+\.\d+\.\d+$/.test(x.rel)) {
                  deps = patch.filter((y) => y.rel === x.rel && y.n !== x.n);
                  if (!deps.length) return `${unclear} (no ${x.rel} items found)`;
                } else if (!x.ver) return unclear;
                else deps = items.filter((y) => y.ver === x.ver && y.n !== x.n);
              } else {
                const keys = [], research = [], oks = [];
                for (const t of after.split(/[,\s]+/).filter(Boolean)) {
                  const rs = t.match(/^research-([a-z0-9-]+)$/);
                  if (rs) { research.push(rs[1]); continue; }
                  if (/^owner-ok-[A-Za-z0-9.-]+$/.test(t)) {
                    const tv = (t.match(/^owner-ok-(\d+\.\d+(?:\.\d+)?)-[A-Za-z0-9-]+$/) || [])[1];
                    if (!(x.rel && before07(x.rel)) && tv !== x.rel) return `${t} is not a ${x.rel || 'versioned'} owner-ok key (K12: from 0.7 on, owner-ok-${x.rel || '<version>'}-<slug>); not understood`;
                    oks.push(t); continue;
                  }
                  const r = t.match(/^(P\d+)([a-z])[–-](?:P\d+)?([a-z])$/); // P5a–d or P5a–P5d
                  if (r) for (let c = r[2].charCodeAt(0); c <= r[3].charCodeAt(0); c++) keys.push(r[1] + String.fromCharCode(c));
                  else if (/^(?:P\d+[a-z]?|S\d+)$/.test(t)) keys.push(t);
                  else if (!/^(?:and|none|nothing)$/i.test(t)) { keys.length = 0; keys.push('?' + t); break; }
                }
                deps = keys.map((k) => x.ver && keyed.get(`${x.ver} ${k}`));
                if (deps.some((d) => !d)) return unclear;
                for (const slug of research) if (!(await researchDone(slug))) return `waits on research-${slug} (no docs/research file on main)`;
                for (const k of oks) if (!(await ownerOk(k))) return `waits on ${k} (no "Owner, typed" row in docs/DECISIONS.md)`;
              }
              const open = deps.filter((d) => d.open);
              return open.length ? `waits on open ${open.map((d) => `${d.key} #${d.n}`).join(', ')}` : '';
            };
            // AFTER-CHECK END
            for (const x of items.filter((y) => y.open && !listed.has(y.n)).sort((a, b) => a.n - b.n)) {
              const ql = x.body.split('\n').find((l) => l.startsWith(`- [next] #${x.n} `));
              if (!ql || !/\bAfter:/.test(x.body)) continue;
              const why = await afterBlocker(x);
              if (why) { if (!why.startsWith('waits on open')) core.info(`#${x.n}: ${why}; left for the planner`); continue; }
              queued.push(ql.trim());
            }
            if (queued.length) {
              // QUEUE-END START (tests/kickoff.mjs runs this block)
              const queueEnd = (ls) => {
                let at = ls.findIndex((l) => l.startsWith('<!-- One line per item'));
                // A "held" note under a line belongs to it: the queue goes on past it (#392 review).
                for (let k = at + 1; at >= 0 && k < ls.length && /^(- \[|\s+- held: )/.test(ls[k]); k++) at = k;
                return at;
              };
              // QUEUE-END END
              const at = queueEnd(lines);
              if (at < 0) core.warning('#114 has no queue comment line; auto-queue skipped');
              else { lines.splice(at + 1, 0, ...queued); pruned = true; core.notice(`queued: ${queued.join(' | ')}`); }
            }
            // Only builds count against MAX (PIP-07 "builds in flight"): a thread's own docs PR is not a build. Every open
            // claude/ PR still marks its lanes busy above. Before 2026-10-20 all claude/ PRs counted, and with MAX 3 five
            // thread PRs held every build (Watchdog, #221 7:33 PM ET).
            const openPrs = refs.filter((r) => r.startsWith('claude/issue-')).length;
            // A started item that already has its PR open is counted once, through the PR.
            const started = lines.filter((l) => { const s = l.match(/^- \[started [^\]]*\] #(\d+)/);
              return s && !refs.some((r) => r.startsWith(`claude/issue-${s[1]}-`)); }).length;
            for (const l of lines) if (/^- \[started /.test(l)) for (const x of lanesOfLine(l)) busy.add(x);
            let inflight = openPrs + started;
            core.info(`busy lanes: ${[...busy].join(', ') || 'none'}`);
            core.info(`in flight: ${openPrs} open build PRs (claude/issue-*) + ${started} started lines; ${refs.length - openPrs} other claude/ PRs only hold lanes`);
            const picked = [];
            const stamp = new Date().toISOString().slice(0, 16) + 'Z';
            // A [next] line can be an item that is already built or building: on 2026-10-17 the planner's rewrite of #114
            // put #202 back to [next] after kickoff had started it, and the next kickoff built it a second time. Skip an
            // issue that has any PR from a claude/issue-N- branch, or a kickoff start comment in the last 9 h with no
            // Blocked / Needs-Opus / no-PR comment after it.
            let allPrRefs = null;
            const alreadyBuilt = async (n) => {
              if (!allPrRefs) allPrRefs = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'all', base: 'main', per_page: 100 })).map((p) => p.head.ref);
              if (allPrRefs.some((r) => r.startsWith(`claude/issue-${n}-`))) return 'it already has a PR';
              const cs = (await github.rest.issues.listComments({ owner, repo, issue_number: n, since: new Date(Date.now() - 9 * 3600e3).toISOString(), per_page: 100 })).data;
              const start = cs.map((c) => c.body || '').findLastIndex((b) => b.startsWith('Kickoff: started a build'));
              if (start < 0) return '';
              const ended = cs.slice(start + 1).some((c) => /^(Blocked:|Needs @claude|Kickoff: the build ended with no PR)/.test(c.body || ''));
              return ended ? '' : 'a kickoff build started in the last 9 h and has not ended';
            };
            // A held note whose line was removed, moved or started by hand is stale: drop it.
            for (let i = lines.length - 1; i >= 0; i--)
              if (/^\s+- held: /.test(lines[i]) && !/^- \[next\] /.test(lines[i - 1] || '')) { lines.splice(i, 1); pruned = true; }
            const kxOf = (n, iss) => items.find((y) => y.n === n) || { n, ver: null, rel: (iss.title.match(/^(?:Release )?(\d+\.\d+(?:\.\d+)?)\b/) || [])[1] || null, key: null, open: true, body: iss.body || '' };
            for (let i = 0; i < lines.length && inflight < MAX; i++) {
              const m = lines[i].match(/^- \[next\] #(\d+) (sonnet|opus)((?: lanes:[^\s]+| alone)*)\s*$/);
              if (!m) continue;
              const alone = / alone/.test(m[3]);
              if (alone && (inflight > 0 || picked.length)) break; // an "alone" item waits; keep queue order
              if (!/ lanes:/.test(m[3]) && !alone) core.warning(`#${m[1]} has no lanes: on its queue line; treated as lanes:none`);
              const want = lanesOfLine(lines[i]);
              const unknown = [...want].filter((x) => !LANES.includes(x));
              if (unknown.length) core.warning(`#${m[1]}: unknown lanes ${unknown.join(', ')} (known: ${LANES.join(', ')})`);
              if (overlap(want, busy)) {
                core.info(`#${m[1]} waits: shares ${[...want].filter((x) => overlap([x], busy)).join(', ')} with work in flight`);
                // A lane-blocked line is never read below, so #503's "After not understood" note outlived its fixed After
                // line (Release Planner (Walter), 2026-10-20). Re-read its After line and drop the note once it reads.
                if (/^\s+- held: After not understood/.test(lines[i + 1] || '')) {
                  const iss = (await github.rest.issues.get({ owner, repo, issue_number: Number(m[1]) })).data;
                  if (!/not understood/.test(await afterBlocker(kxOf(Number(m[1]), iss)))) { lines.splice(i + 1, 1); pruned = true; }
                }
                continue;
              }
              const n = Number(m[1]);
              const iss = (await github.rest.issues.get({ owner, repo, issue_number: n })).data;
              if (iss.state !== 'open' || iss.pull_request) { core.warning(`#${n} is not an open issue; skipped`); continue; }
              const kx = kxOf(n, iss);
              const wait = await afterBlocker(kx);
              if (wait) {
                // An After line kickoff can't read is easy to miss (an alone one also holds every line below it): warn, and
                // put a note under the line in #114, where the planner and anyone reading the queue see it (Kaizen (Gale), 2026-10-18).
                if (/not understood/.test(wait)) {
                  core.warning(`#${n}: ${wait}; held${alone ? ', and as an alone line it holds the queue below it' : ''}`);
                  if (!/^\s+- held: /.test(lines[i + 1] || '')) { lines.splice(i + 1, 0, `  - held: After not understood (kickoff ${stamp})`); pruned = true; }
                  else if (!/held: After not understood/.test(lines[i + 1])) { lines[i + 1] = `  - held: After not understood (kickoff ${stamp})`; pruned = true; }
                } else {
                  core.info(`#${n}: ${wait}; left in #114 for the planner`);
                  if (/^\s+- held: /.test(lines[i + 1] || '')) { lines.splice(i + 1, 1); pruned = true; } // it reads now, it just waits
                }
                if (alone) break; continue; // an "alone" item keeps queue order
              }
              const ins = inputPaths(iss.body), missing = [...ins.mnt], bare = ins.bare;
              let lookupFailed = false;
              for (const pth of ins.repo) {
                const at = lookupPath(pth);
                if (!at) continue;
                try { await github.rest.repos.getContent({ owner, repo, path: at, ref: 'main' }); }
                catch (e) { if (e.status === 404) missing.push(pth); else { lookupFailed = true; core.warning(`#${n}: could not look up input ${pth} (${e.status || e.message}); held this run`); } }
              }
              if (missing.length || bare.length || lookupFailed) {
                if (missing.length || bare.length) {
                  core.warning(`#${n}: spec input not in repo: ${[...missing, ...bare.map((x) => `${x} (no repo path)`)].join(', ')}; held`);
                  const note = `  - held: input not in repo (kickoff ${stamp})`;
                  if (!/^\s+- held: /.test(lines[i + 1] || '')) { lines.splice(i + 1, 0, note); pruned = true; }
                  else if (!/held: input not in repo/.test(lines[i + 1])) { lines[i + 1] = note; pruned = true; } // an older note's reason no longer holds
                  const said = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 })).map((c) => c.body || '');
                  const lines2 = [...missing.map((x) => `spec: input not in repo: ${x}`), ...bare.map((x) => `Inputs: ${x} has no repo path`)];
                  const fresh = lines2.filter((x) => !said.some((b) => b.includes(x)));
                  if (fresh.length) await github.rest.issues.createComment({ owner, repo, issue_number: n,
                    body: fresh.join('\n') + '\n\nKickoff holds this item until every input the spec names is a repo path on main (builds can\'t read /mnt/ or the web), or an After key for a research item that runs first. Release Planner: commit the file and name its path, or fix the entry; the queue line stays.' });
                }
                if (alone) break; continue;
              }
              // PLAN-INPUTS (block above): the plan's inputs and After keys must be in the spec.
              const pref = planRef(iss.body);
              if (pref) {
                let gaps = null, planWhy = '';
                try {
                  const ptxt = Buffer.from((await github.rest.repos.getContent({ owner, repo, path: pref.file, ref: 'main' })).data.content, 'base64').toString('utf8');
                  if (repoTops === null) repoTops = new Set((await github.rest.repos.getContent({ owner, repo, path: '', ref: 'main' })).data.map((x) => x.name));
                  if (roadmapText === null) roadmapText = Buffer.from((await github.rest.repos.getContent({ owner, repo, path: 'ROADMAP.md', ref: 'main' })).data.content, 'base64').toString('utf8');
                  const sec = planSection(ptxt, pref.sec);
                  if (sec === null) planWhy = `plan section §${pref.sec} not found in ${pref.file}`;
                  else gaps = planGaps(iss.body, sec, roadmapRows(roadmapText, pref), repoTops);
                } catch (e) {
                  if (e.status !== 404) { core.warning(`#${n}: could not read plan ${pref.file} (${e.status || e.message}); held this run`); if (alone) break; continue; }
                  planWhy = `plan file ${pref.file} not on main`;
                }
                const said = (gaps && gaps.notNeeded.length) || planWhy || (gaps && (gaps.paths.length || gaps.keys.length))
                  ? (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 })).map((c) => c.body || '') : [];
                // "not needed" counts as listed; the comment is where Watchdog logs it and Kaizen counts it.
                const nnLines = (gaps ? gaps.notNeeded : []).map((x) => `spec: not needed: ${x.path} (${x.why})`).filter((x) => !said.some((b) => b.includes(x)));
                if (nnLines.length) {
                  core.notice(`#${n}: ${nnLines.join('; ')}`);
                  await github.rest.issues.createComment({ owner, repo, issue_number: n, body: nnLines.join('\n') + '\n\nKickoff counts these plan paths as listed. Watchdog logs each one; Kaizen counts them.' });
                }
                const gapLines = planWhy ? [`spec: plan not readable: ${planWhy}`]
                  : [...gaps.paths.map((x) => `spec: plan input missing: ${x}`), ...gaps.keys.map((x) => `spec: plan After key missing: ${x}`)];
                if (gapLines.length) {
                  core.warning(`#${n}: ${gapLines.join('; ')}; held`);
                  const note = `  - held: spec misses plan inputs (kickoff ${stamp})`;
                  if (!/^\s+- held: /.test(lines[i + 1] || '')) { lines.splice(i + 1, 0, note); pruned = true; }
                  else if (!/held: spec misses plan inputs/.test(lines[i + 1])) { lines[i + 1] = note; pruned = true; }
                  const fresh = gapLines.filter((x) => !said.some((b) => b.includes(x)));
                  if (fresh.length) await github.rest.issues.createComment({ owner, repo, issue_number: n,
                    body: fresh.join('\n') + `\n\nKickoff holds this item until the spec lists every repo path its plan text names (\`${pref.file}\`${pref.sec ? ` §${pref.sec}` : ''} and its ROADMAP row) in Inputs or Files, or as "\`<path>\` — not needed: <reason>", and every After or research key of the plan in its After line. Release Planner: re-spec the issue from the plan; the queue line stays. Watchdog: log this refusal.` });
                  if (alone) break; continue;
                }
              }
              const genMiss = genLaneMiss(want, iss.body);
              if (genMiss) {
                core.warning(`#${n}: spec: gen lane missing (${genMiss}); held`);
                const note = `  - held: spec: gen lane missing (kickoff ${stamp})`;
                if (!/^\s+- held: /.test(lines[i + 1] || '')) { lines.splice(i + 1, 0, note); pruned = true; }
                else if (!/held: spec: gen lane missing/.test(lines[i + 1])) { lines[i + 1] = note; pruned = true; }
                const said = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 })).map((c) => c.body || '');
                if (!said.some((b) => b.includes('spec: gen lane missing'))) await github.rest.issues.createComment({ owner, repo, issue_number: n,
                  body: `spec: gen lane missing: ${genMiss}\n\nKickoff holds this item until its queue line's lanes include gen (a data/ change compiles through tools/gen; .github/routing/gen-lane.json). Release Planner: add gen to the lanes in #114 and the spec, or reword the spec if it doesn't touch gen; the queue line stays.` });
                if (alone) break; continue;
              }
              const why = await alreadyBuilt(n);
              if (why) { core.warning(`#${n} not started again: ${why}`); lines[i] = `- [started ${stamp}] #${n} ${m[2]}${m[3]}`; pruned = true; continue; }
              const fileHit = m[2] !== 'opus' && opusPath(iss.body), workHit = m[2] !== 'opus' && !fileHit && opusWork(want, iss.body);
              const hit = fileHit || workHit;
              if (fileHit) core.notice(`#${n}: queued sonnet, but ${/^no /.test(fileHit) ? 'it has no readable Files list' : `its Files list names ${fileHit} (an Opus path, .github/routing/opus-paths.json)`}; started on Opus (PIP-06)`);
              if (workHit) core.notice(`#${n}: queued sonnet, but it runs gen or re-records golden (${workHit}); started on Opus (Kaizen, 2026-10-20)`);
              picked.push({ issue: n, model: m[2] === 'opus' || hit ? 'claude-opus-5-5' : 'claude-sonnet-5-5', title: iss.title });
              lines[i] = `- [started ${stamp}] #${n} ${m[2]}${m[3]}`;
              if (/^\s+- held: /.test(lines[i + 1] || '')) lines.splice(i + 1, 1); // its After line reads now: drop the note
              for (const x of want) busy.add(x);
              inflight++;
              if (alone) break;
            }
            if (!picked.length && !pruned) return core.info('nothing to start');
            // Read-modify-write of a shared issue: if someone (the planner) edited it meanwhile, start nothing and
            // leave their edit; the next merge or a dispatch retries on the fresh body.
            const now = (await github.rest.issues.get({ owner, repo, issue_number: STATE })).data.body || '';
            if (now !== body) { core.warning('#114 changed during this run; nothing started, retry later'); return; }
            await github.rest.issues.update({ owner, repo, issue_number: STATE, body: lines.join('\n') });
            // Comments only after #114 was written, so a retried run doesn't comment twice.
            for (const n of stalled) await github.rest.issues.createComment({ owner, repo, issue_number: n,
              body: 'Kickoff: no PR 9 h after this build started; marked stalled in #114 for the CEO planner.' });
            if (!picked.length) return core.info('nothing to start');
            for (const p of picked) await github.rest.issues.createComment({ owner, repo, issue_number: p.issue,
              body: `Kickoff: started a build on this issue (${p.model.includes('opus') ? 'Opus' : 'Sonnet'}). It will open a claude/ PR when done.` });
            core.notice(`started: ${picked.map((p) => '#' + p.issue).join(', ')}`);
            core.setOutput('items', JSON.stringify(picked));

  build:
    needs: pick
    if: needs.pick.outputs.items != '[]'
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.pick.outputs.items) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: build-issue-${{ matrix.item.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # A Restart re-run, or a duplicate pick, must not rebuild finished work (2026-10-17: #202 was built twice).
      - name: Skip if the issue is closed or another build already opened its PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.item.issue }}
          BRANCH: claude/issue-${{ matrix.item.issue }}-${{ github.run_id }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .state)
          other=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" \
            --jq ".[] | select(.head.ref | startswith(\"claude/issue-$ISSUE-\")) | select(.head.ref != \"$BRANCH\") | .number" | head -1)
          if [ "$state" = closed ] || [ -n "$other" ]; then
            echo "::notice::#$ISSUE skipped: issue $state, other PR ${other:-none}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 1
          # Not persisted: the action pushes as the Claude GitHub App, so its pushes and PR trigger CI (see claude.yml).
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci && npx playwright install --with-deps chromium
      - if: steps.gate.outputs.skip != 'true'
        run: echo "BUILD_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.skip != 'true'
        # `npm test` takes about 10 min, over Bash's default 2-min limit, so builds ran it in the background and the run
        # ended with it unfinished: #491, #496, #505 and #507 opened no PR, #518 said "npm test: TESTRESULT" (2026-10-19).
        env:
          BASH_DEFAULT_TIMEOUT_MS: '1800000'
          BASH_MAX_TIMEOUT_MS: '1800000'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A merge's CI on main is dispatched by auto-merge (github-actions), not a person.
          allowed_bots: "claude,github-actions"
          additional_permissions: |
            actions: read
          prompt: |
            You build issue #${{ matrix.item.issue }} in ${{ github.repository }}. Read CLAUDE.md first and follow it, then `gh issue view ${{ matrix.item.issue }} --comments` for the spec.
            Create a branch named claude/issue-${{ matrix.item.issue }}-${{ github.run_id }} from main (if origin already has that branch, an earlier attempt of this run died: check it out and continue from it), implement the issue, then `git fetch origin main` and `git merge origin/main` (a merge commit; resolve any conflict keeping both sides' intent; main moves while you build), and make sure `npm test` is green after that merge, before the last push. Never skip, disable or weaken a test or check.
            Commit with a clear message, `git push origin HEAD`, then write the PR body to `tests/out/pr-body.md` (never under `.git/`: writes there are denied; what changed and how it was tested, quoting the summary line your last `npm test` printed, never a placeholder: #518 opened with "npm test: TESTRESULT" and red CI; then a blank line, then a line that is exactly `Closes #${{ matrix.item.issue }}`) and open the PR: `gh pr create --base main --title "<short title>" --body-file tests/out/pr-body.md`. CI and the review start on their own.
            Run commands in the foreground only, `npm test` included (Bash allows 30 minutes here): a background command is lost when your turn ends, so the run ends with nothing opened. Push after every commit (a run that dies is restarted once and continues from the pushed branch).
            Tools: one plain command per Bash call (no `&&`, `;`, pipes, heredocs, `python3 -`, scripts in /tmp, or env-var prefixes like `X=1 node ...`: they are denied; pass flags instead); create and edit files with Edit and Write.
            Clock: the GitHub token expires 1 hour after this run starts (P6 #198 lost its last push at minute 62). Aim to open the PR by minute 45. If a push fails with 401 or "Bad credentials", stop at once: the run is restarted with a fresh token and continues from the pushed branch. While iterating use `node tests/run.mjs --only <suites>` after `npm run build` and batch slow golden or pixel runs; run the full `npm test` once at the end.
            ${{ contains(matrix.item.model, 'sonnet') && format('Sonnet limits (owner routing rule, list in .github/routing/opus-paths.json): if the work would touch {0}, do not edit. Post one comment on the issue starting "Needs @claude (Opus):" with the reason, then stop.', needs.pick.outputs.touches) || '' }}
            If the issue cannot be done safely (unverifiable game data, an owner decision), do not push. Post one comment on the issue starting "Blocked:" with the reason in one or two lines.
          claude_args: |
            --model ${{ matrix.item.model }}
            --max-turns 400
            --allowedTools "Bash(npm:*),Bash(node:*),Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(diff:*),Bash(sort:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(sed:*),Bash(find:*),Bash(jq:*),Edit,Write,Read,Glob,Grep,WebFetch,WebSearch"
      # A build that ends "success" with no PR and no Blocked / Needs-Opus comment did nothing (#136, 2026-10-16: 13 turns,
      # 2 permission denials, no push, no comment). Fail the job so restart.yml re-runs it once, and print the denials
      # (the action hides the transcript) so the cause is in the log.
      - name: Check the build left a PR or a reason
        id: check
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.item.issue }}
          BRANCH: claude/issue-${{ matrix.item.issue }}-${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          diag=""
          if [ -f "$out" ]; then
            diag=$(jq -r '([.[] | select(.type == "result")] | last) as $r
              | "turns=\($r.num_turns) denials=\($r.permission_denials_count) end=\($r.subtype)",
                (($r.permission_denials // [])[] | "denied: \(.tool_name) \(.tool_input | tostring | .[0:200])"),
                ([.[] | select(.type == "user") | .message.content[]? | select(.type? == "tool_result" and .is_error == true)
                  | .content | if type == "array" then map(.text? // "") | join(" ") else tostring end | .[0:300]] | .[-3:][] | "tool error: \(.)"),
                ([.[] | select(.type == "assistant") | .message.content[]? | select(.type? == "text") | .text] | last // "" | "last text: \(.[0:400])")' \
              "$out" 2>/dev/null || true)
            echo "$diag"
          fi
          # K16 (Kaizen (Gale), 0.7 review, 2026-10-19): 7 of 28 0.7 builds pushed but opened no PR and P20's first build
          # failed with no reason, all unlogged, and job logs return 403 to the sessions that read them. A build that
          # opens no PR leaves its reason as a run annotation (readable through the check-runs API; secrets are masked
          # there, unlike in an artifact of this public repo) and one Waste line on #114.
          waste() {
            [ -n "$diag" ] || diag="no execution output"
            body=$(printf '%s' "$diag" | head -c 1500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | tr -d '\r')
            echo "::warning title=Build of #$ISSUE opened no PR::$body"
            gh api "repos/$GITHUB_REPOSITORY/issues/114/comments" -f body="Waste: 1 build of #$ISSUE $1 ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT). Cause: the run's \"Build of #$ISSUE opened no PR\" annotation (turns, denials, tool errors, last text). (K16)" >/dev/null || true
          }
          prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&head=$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq length)
          said=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?since=$BUILD_START&per_page=100" \
            --jq '[.[] | select(.body | test("^(Blocked:|Needs @claude)"))] | length')
          echo "PRs for $BRANCH: $prs; Blocked/Needs comments since $BUILD_START: $said"
          # Build Pipeline (Gus), 2026-10-21: the PR check's PR OPENED notices for #711, #715 and #717 came late, so the
          # build's own run announces the PR on #114 as soon as it exists (the fallback below does the same for the PR it opens).
          if [ "$prs" != 0 ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&head=$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq '.[0] | "#\(.number) \(.html_url)"')
            gh api "repos/$GITHUB_REPOSITORY/issues/114/comments" -f body="PR OPENED: ${pr%% *} for #$ISSUE, by its build ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). ${pr#* }" >/dev/null || true
          fi
          # Finished work pushed but no PR (0.6 P1, Kickoff 39091541671, 2026-10-17: a full Sonnet re-run just to open it,
          # #221 11:23 PM ET, #222 11:25 PM ET): the next step opens it. GITHUB_TOKEN can't (repo setting: "GitHub Actions
          # is not permitted to create or approve pull requests", 0.6 P21, Kickoff 39100109738), and the action above
          # revokes its app token when it ends, so the next step is a short run of the action with a fresh one.
          ahead=0
          if [ "$prs" = 0 ] && [ "$said" = 0 ]; then
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" --jq .ahead_by 2>/dev/null || echo 0)
          fi
          if [ "$prs" = 0 ] && [ "$said" = 0 ] && [ "$ahead" -gt 0 ]; then
            mkdir -p tests/out
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .title > tests/out/kickoff-pr-title.txt
            if [ ! -s tests/out/pr-body.md ]; then
              printf 'Opened by kickoff: the build pushed %s commit(s) to `%s` but ended without a PR (%s). The review checks the work against the issue as usual.\n\nCloses #%s\n' \
                "$ahead" "$BRANCH" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$ISSUE" > tests/out/pr-body.md
            fi
            grep -q "Closes #$ISSUE" tests/out/pr-body.md || printf '\nCloses #%s\n' "$ISSUE" >> tests/out/pr-body.md
            # A body the build wrote ahead with a placeholder for its test result (#518: "npm test: TESTRESULT", CI red)
            # must not claim a result: say the run ended first and CI decides (Kaizen (Gale), #222 Oct 19 11:04 PM).
            if grep -q 'TESTRESULT' tests/out/pr-body.md; then
              sed -i 's/TESTRESULT/not finished by the build (the run ended first; CI on this PR is the result)/g' tests/out/pr-body.md
              echo "::warning title=Build of #$ISSUE left a test-result placeholder::the PR body said TESTRESULT; replaced with 'not finished by the build'"
            fi
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "::notice::#$ISSUE: $ahead commits pushed but no PR; opening it as the Claude app"
            waste "pushed its work but opened no PR; kickoff's fallback opens it"
            exit 0
          fi
          if [ "$prs" = 0 ] && [ "$said" = 0 ]; then
            if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then note="restart.yml re-runs it once"; else note="it already ran twice, so it is not restarted; the planner reads why"; fi
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="Kickoff: the build ended with no PR and no Blocked or Needs-Opus comment ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); $note." >/dev/null
            waste "ended with no PR and no Blocked or Needs-Opus comment; $note"
            echo "::error::Build of #$ISSUE ended with no PR and no reason"
            exit 1
          fi
      # One command, so Sonnet with a few turns; a PR opened as the app starts CI and the review on its own.
      - uses: anthropics/claude-code-action@v1
        if: steps.check.outputs.open == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude,github-actions"
          prompt: |
            Open the pull request for branch claude/issue-${{ matrix.item.issue }}-${{ github.run_id }}. Read the title from tests/out/kickoff-pr-title.txt with the Read tool, then run exactly one command: `gh pr create --base main --head claude/issue-${{ matrix.item.issue }}-${{ github.run_id }} --title "<that title>" --body-file tests/out/pr-body.md`. Change no files, push nothing, and stop after that command.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 6
            --allowedTools "Bash(gh pr create:*),Read"
      - name: Check the fallback opened the PR
        if: steps.check.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.item.issue }}
          BRANCH: claude/issue-${{ matrix.item.issue }}-${{ github.run_id }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&head=$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq '.[0].html_url // empty')
          if [ -n "$url" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="Kickoff: the build pushed its work but opened no PR, so kickoff opened it: $url (CI and the review start on their own)." >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/issues/114/comments" -f body="PR OPENED: #${url##*/} for #$ISSUE, by kickoff's fallback ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). $url" >/dev/null || true
            echo "::notice::Opened $url for #$ISSUE"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="Kickoff: the build pushed its work to \`$BRANCH\` but neither it nor kickoff's fallback opened a PR ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Open it from the branch; don't rebuild." >/dev/null
          echo "::error::Fallback did not open a PR for #$ISSUE"
          exit 1

  # Owner request (2026-10-16): right after a merge, bring main into every open claude/ PR that now conflicts with it or
  # shares a serial file (lane) with the merged diff, before CI or a review is spent on a stale branch.
  #   - Clean and no golden/mig lane: GitHub's update-branch (a merge commit, no model), then CI is dispatched on the
  #     branch (a push made with this workflow's token starts no CI by itself).
  #   - Conflicting, or golden/mig involved: pipeline.yml step=merge (a model run; Opus for golden/mig).
  refresh:
    if: inputs.sha != ''
    concurrency:
      group: kickoff-refresh
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const merged = (await github.rest.repos.getCommit({ owner, repo, ref: context.payload.inputs.sha })).data.files || [];
            // Keep in step with lanesOfFiles() in the pick job above (same rules, two copies).
            const lanes = (files) => {
              const out = new Set();
              for (const f of files) {
                const n = f.filename, patch = f.patch || '';
                // Snapshots live per card folder since 0.4 P4e, so each folder is its own lane; anything else under
                // tests/golden (golden.js, states.js, _state/) is the whole golden lane (0.6 kaizen K9, #222).
                const gf = n.match(/^tests\/golden\/snapshots\/([a-z][a-z0-9-]*)\//);
                if (gf) out.add(`golden-${gf[1]}`); else if (/^tests\/golden\//.test(n)) out.add('golden');
                if (/^tests\/e2-migtest/.test(n) || /mig1/.test(patch)) out.add('mig');
                if (n === 'src/main.js') out.add('main.js');
                if (/^data\//.test(n) && /"(requires|completesWith|is)"/.test(patch)) out.add('gates');
                if (/^tools\/gen\//.test(n)) out.add('gen');
                if (n === 'src/styles/app.css') out.add('app.css');
                if (n === '.github/workflows/ci.yml') out.add('ci');
                if (n === 'tests/a11y.js') out.add('a11y');
                if (n === 'package.json' || n === 'CHANGELOG.md') out.add('release');
              }
              return out;
            };
            const done = lanes(merged);
            core.info(`merged diff lanes: ${[...done].join(', ') || 'none'}`);
            const prs = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 }))
              .filter((p) => /^claude\//.test(p.head.ref) && p.head.repo && p.head.repo.full_name === `${owner}/${repo}` && !p.draft
                && !p.labels.some((l) => ['hold', 'stuck'].includes(l.name)));
            for (const p0 of prs) {
              let pr = (await github.rest.pulls.get({ owner, repo, pull_number: p0.number })).data;
              if (pr.mergeable === null) { await new Promise((r) => setTimeout(r, 15000)); pr = (await github.rest.pulls.get({ owner, repo, pull_number: p0.number })).data; }
              const mine = lanes(await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 }));
              const shared = [...mine].filter((x) => [...done].some((y) => x === y || (x === 'golden' && y.startsWith('golden-')) || (y === 'golden' && x.startsWith('golden-'))));
              const conflict = pr.mergeable === false;
              if (!conflict && !shared.length) { core.info(`#${pr.number}: no conflict, no shared lane`); continue; }
              if (pr.mergeable === null) { core.warning(`#${pr.number}: mergeability unknown; left for the planner`); continue; }
              if (!conflict && !shared.some((x) => x.startsWith('golden') || x === 'mig')) {
                try {
                  await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number, expected_head_sha: pr.head.sha });
                  // update-branch is asynchronous: wait (up to 2 min) until the merge commit is the head, so CI runs on it.
                  let moved = false;
                  for (let i = 0; i < 24 && !moved; i++) {
                    await new Promise((r) => setTimeout(r, 5000));
                    moved = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data.head.sha !== pr.head.sha;
                  }
                  if (!moved) throw new Error('head did not move within 2 min');
                  await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'ci.yml', ref: pr.head.ref });
                  core.notice(`#${pr.number}: merged main in (shares ${shared.join(', ')}), CI dispatched`);
                  continue;
                } catch (e) { core.warning(`#${pr.number}: update-branch failed (${e.message}); handing to a merge run`); }
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pipeline.yml', ref: 'main',
                inputs: { pr: String(pr.number), step: 'merge' } });
              core.notice(`#${pr.number}: merge run dispatched (${conflict ? 'conflicts with main' : 'shares ' + shared.join(', ')})`);
            }
