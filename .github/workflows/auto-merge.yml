name: Auto-merge

# Added by the owner (2026-10-16): merge a bot PR once it is green and reviewed, so the pipeline runs while he is away.
# A PR qualifies only when ALL of these hold:
#   - it comes from a claude/ branch in this repo, targets main, is open, not a draft, and has no "hold" label (auto-merge adds
#     and lifts hold itself under the rules in the HOLD-CHECK block below, #709);
#   - the required check ci-ok succeeded on its current head commit;
#   - the latest claude[bot] review comment says "VERDICT: APPROVE", was written after the head commit, and names the head's
#     short SHA (e.g. "Review of abc1234"), so a review of an older commit can't cover a newer one pushed later.
#   - a PR that commits review shots (docs/reviews/<minor>-<item>-shots/) or mockups / design docs (docs/design/**,
#     since 2026-10-20, #619) also has the Design Lead's "DESIGN OK" on its
#     head (owner, typed 2026-10-18 7:13 PM ET in the Build Pipeline thread; "DESIGN-CHECK" block below).
#   - a PR that touches game data (data/** outside data/schema/, docs/research/**, any icons/ dir) or is a research PR
#     (branch claude/research-*, title starting "research") also has Game Data Check's "Game Data Check (ROL-03) on <sha>:
#     VERIFIED" on its head: ROL-03 (owner, typed 2026-10-19 5:20 PM ET) says Gretchen verifies before merge; the Chanter
#     pack #486 merged on the bot review alone. Scope: Kaizen (Gale), 2026-10-19 9:35 PM ET ("DATA-CHECK" block below).
# Every verdict line above is read by tools/verdicts.cjs, the parser pipeline.yml shares (bold or plain, `code`, "> " quotes).
# It squash-merges pinned to that head commit, then starts CI on main so deploy, smoke and release run
# (a merge made by this workflow does not fire the normal push trigger).
#   - while #114 has a "FREEZE: RC <sha> release #<n>" line, only docs/ROADMAP/issue-template PRs, the release PR and
#     rc-blocker PRs merge (owner OK 2026-10-20 1:35 PM ET; "FREEZE-CHECK" block below).
# Pause it for one PR: add the label "hold" (auto-merge lifts only a hold it added itself, #709). Stop it: Actions tab -> Auto-merge -> "..." -> Disable workflow.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  issues: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      # Only the shared verdict parser, from main (never a PR's copy).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/verdicts.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Every verdict line is read by tools/verdicts.cjs (bold, `code` and "> " quotes allowed; struck text never counts).
            const V = require(`${process.env.GITHUB_WORKSPACE}/tools/verdicts.cjs`);
            const prs = (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 }))
              .filter((p) => !p.draft && p.head.repo && p.head.repo.full_name === `${owner}/${repo}` && /^claude\//.test(p.head.ref));
            // DESIGN-CHECK START (tests/automerge.mjs runs this block)
            // A PR with review shots waits for a line starting (bold or plain) "DESIGN OK" from claude[bot] or the repo owner that
            // names the head's short SHA and is newer than the head commit. The latest DESIGN OK / DESIGN CHANGES comment decides.
            // '' = no wait. Bold since #551/#554 (2026-10-20): "**DESIGN OK on <sha>**" went unseen by this check and pipeline.yml.
            // Mockups and design docs (docs/design/**) wait too since 2026-10-20: #619's 0.9 mockups merged on the bot's
            // APPROVE before the Design Lead's look OK, because only review shots were gated. Not the files in DESIGN_FREE:
            // Design Review's checklist (K24, its owner is not the Design Lead) and the engineering docs with no look in
            // them (Code Review, #655). A new docs/design file waits until it is listed here: a needless wait costs one
            // DESIGN OK, a missed one is #619.
            const DESIGN_FREE = new Set(['review-checklist.md', 'sync.md', '0.2.5-save-safety.md', '0.3-requirement-engine.md',
              '0.4-engine-contract.md'].map((f) => `docs/design/${f}`));
            const LOOKS = (f) => /^docs\/reviews\/[^/]+-shots\//.test(f) || (/^docs\/design\//.test(f) && !DESIGN_FREE.has(f));
            const designBlocker = (files, comments, sha, headAt) => {
              if (!files.some(LOOKS)) return '';
              const marks = comments.filter((c) => c.user && (c.user.login === 'claude[bot]' || c.user.login.toLowerCase() === owner.toLowerCase())
                && V.design(c.body)).sort((a, b) => Date.parse(a.updated_at) - Date.parse(b.updated_at));
              const last = marks[marks.length - 1];
              if (!last) return 'shots wait on DESIGN OK';
              if (V.design(last.body) === 'CHANGES') return 'Design Lead asked for changes (DESIGN CHANGES)';
              if (Date.parse(last.updated_at) < headAt || !last.body.includes(sha.slice(0, 7))) return `DESIGN OK does not cover the head ${sha.slice(0, 7)}`;
              // Sessions post as the owner's account too, so log which it was: the Claude Code footer marks a session's comment.
              core.info(`DESIGN OK by ${last.user.login}, ${/Generated by \[Claude Code\]/.test(last.body) ? 'from a Claude session' : 'typed (no Claude Code footer)'}`);
              return '';
            };
            // DESIGN-CHECK END
            // DATA-CHECK START (tests/automerge.mjs runs this block)
            // A data or research PR waits for Game Data Check's verdict on its head: a line starting (bold or plain) "Game Data
            // Check (ROL-03) on <short SHA>: VERIFIED" from claude[bot] or the repo owner, newer than the head commit. The
            // latest VERIFIED / CHANGES / HOLD verdict decides; a struck-out verdict ("~~...") doesn't count. '' = no wait.
            // Gretchen's own PRs (claude/game-data-check-*) are hers to verify, so they don't wait on themselves.
            // Known limit: every session posts as the owner's account, so this checks the verdict's text, not who wrote it.
            // It guards against an accidental merge, not a forged verdict; no session but Game Data Check posts that line.
            // public/icons/ is our own PWA icon set, not game art.
            const DATAFILE = (f) => (/^data\//.test(f) && !/^data\/schema\//.test(f)) || /^docs\/research\//.test(f)
              || (/(^|\/)icons\//.test(f) && !/^public\/icons\//.test(f));
            const NEEDSDATA = (pr, files) => !/^claude\/game-data-check-/.test(pr.head.ref)
              && (/^claude\/research-/.test(pr.head.ref) || /^research\b/i.test(pr.title || '') || files.some(DATAFILE));
            // A VERIFIED on an earlier head still holds when every commit of the PR's own after it (not on the base branch) is a
            // merge (main brought in) and nothing since changed this PR's own data files: each main merge into a class PR used to
            // void her check and ask for a fresh one (Release Planner (Walter), 2026-10-19). The squashed main commits a merge
            // brings in have one parent, so only commits missing from the base count. Any doubt (a plain commit of the PR's, a
            // big compare, an API error) waits. data/DATA_SOURCES.md is left out (Isaac, typed in the Gus thread 2026-10-20
            // 5:50 AM ET): the generator rewrites it from the other data files and CI's gen check fails a stale copy, so a main
            // merge that only regenerates it doesn't void her check. Game Data Check's conditions: every other data, research
            // and icon file of the PR stays byte-identical to the verified head, and the carry log names the skipped file.
            // Returns null when the verdict doesn't carry, else the skipped files that changed (often none).
            const CARRYSKIP = new Set(['data/DATA_SOURCES.md']);
            const carried = async (on, sha, files, base) => {
              try {
                const cmp = (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${on}...${sha}` })).data;
                if (cmp.status !== 'ahead' || !cmp.commits.length || cmp.commits.length >= 250 || (cmp.files || []).length >= 300) return null;
                const off = (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${base}...${sha}` })).data;
                if (!off.commits.length || off.commits.length >= 250) return null;
                const mine = new Set(off.commits.map((k) => k.sha));
                const own = cmp.commits.filter((k) => mine.has(k.sha));
                if (!own.length || !own.every((k) => k.parents.length === 2)) return null;
                const changed = new Set((cmp.files || []).flatMap((f) => [f.filename, f.previous_filename].filter(Boolean)));
                const hit = files.filter(DATAFILE).filter((f) => changed.has(f));
                return hit.every((f) => CARRYSKIP.has(f)) ? hit : null;
              } catch (e) { return null; }
            };
            const dataBlocker = async (pr, files, comments, sha, headAt) => {
              if (!NEEDSDATA(pr, files)) return '';
              const marks = comments.filter((c) => c.user && (c.user.login === 'claude[bot]' || c.user.login.toLowerCase() === owner.toLowerCase())
                && V.data(c.body).length).sort((a, b) => Date.parse(a.updated_at) - Date.parse(b.updated_at));
              const last = marks[marks.length - 1];
              if (!last) return 'waits on Game Data Check (ROL-03)';
              const [{ sha: on, verdict }] = V.data(last.body);
              if (verdict !== 'VERIFIED') return `Game Data Check says ${verdict} (ROL-03)`;
              if (sha.startsWith(on) && Date.parse(last.updated_at) >= headAt) return '';
              // no updated_at check on a carry: compare status 'ahead' means `on` is an ancestor, so the verdict came after it
              const skipped = sha.startsWith(on) ? null : await carried(on, sha, files, pr.base.ref);
              if (skipped) {
                core.info(`#${pr.number}: VERIFIED on ${on} carries to ${sha.slice(0, 7)} (only merges since, none changed its data files`
                  + (skipped.length ? `; changed but left out of the check: ${skipped.join(', ')})` : ')'));
                return '';
              }
              return `Game Data Check's VERIFIED does not cover the head ${sha.slice(0, 7)}`;
            };
            // DATA-CHECK END
            // NAMED-CHECK START (tests/automerge.mjs runs this block)
            // A named reviewer's CHANGES blocks the merge until the same reviewer approves the current head (automerge-race,
            // incident fast path 2026-10-20 8:37 PM ET; #553, #615, #653, #664 merged over a CHANGES). Named verdicts are
            // "VERDICT: APPROVE|OK|CHANGES (reviewer: <name>)", plus the Design Lead's DESIGN OK / CHANGES and Game Data Check's
            // VERIFIED / CHANGES / HOLD under their own names. A CHANGES is sticky across pushes: only an APPROVE / OK / VERIFIED
            // by that reviewer that is newer than it and names the head clears it. The deadlock exit is the coordinator's
            // "REVIEW CLEAR (reviewer: <name>; trigger: <n|none>): <reason>" for a reviewer who has ended; it is refused on
            // triggers 2, 4b, 5 and 6, and Watchdog (Mike) flags every clear. A message to a session is not a verdict.
            // Reviewers keep the marks the gates already parse (Kaizen, 2026-10-20): DESIGN OK / CHANGES counts as the Design
            // Lead's (also "jane"), Game Data Check (ROL-03) as Game Data Check's (also "gretchen"), FRESH REVIEW OK / CHANGES as
            // "fresh review" (a FRESH REVIEW #<n> note without an OK line is a CHANGES); everyone else tags the VERDICT line, and only a
            // comment's last tagged line counts. A PR body line "Reviewers: <name>, ..." makes each named
            // reviewer's approval of the head required, so such a PR needn't open with hold.
            // Game Data Check's own data, research or icon PRs (claude/game-data-check-*) skip DATA-CHECK, so the merge loop
            // passes implied = ['lydia']: Source Vetting (Lydia) must approve their head (#665 merged over her CHANGES; K24 gap).
            // Verdicts are ordered by created_at, so editing an old comment doesn't move it past a later CHANGES. A tagged verdict
            // or a FRESH REVIEW OK names the head when the head's short SHA is on that line; a DESIGN or data mark, anywhere in
            // the comment. Quoted lines ("> ...") and claude[bot] comments are never a named verdict here (DESIGN and data marks included; the
            // design and data gates below keep their own readers). Every fresh reviewer shares
            // the one name "fresh review": the last fresh note decides (one fresh reviewer per PR).
            // Known limit: sessions post as the owner's account, so the name (and a REVIEW CLEAR) is the comment's word, not a
            // checked identity.
            const NOCLEAR = new Set(['2', '4b', '5', '6']);
            const ALIAS = { jane: 'design lead', gretchen: 'game data check' };
            // A name's trailing parenthetical is a note, not part of the name: "Reviewers: Francesca (records and plan text)" (#707)
            // never matched her tagged verdict and so failed closed (#709).
            const who = (name) => { const n = name.replace(/\s*\([^)]*\)\s*$/, '').trim(); return ALIAS[n] || n; };
            // A clear is refused when the PR itself shows one of those triggers, whatever the clear says: its body's "Review:" line
            // names 2, 4b, 5 or 6, it carries hold or fresh-review, or it touches a save key (src/core/state.js) or is a release
            // (CHANGELOG.md) (Fresh governance review, #686).
            const SAVEKEY = (f) => f === 'src/core/state.js' || f === 'CHANGELOG.md';
            const prNoClear = (prBody, labels, files) => {
              const r = V.lines(prBody).find((l) => /^(?:[-*]\s+)?Review:/i.test(l));
              // The whole line counts (ROADMAP's "Review: external — 2" has no word "trigger"); only a reviewer count such as
              // "2 reviewers" is dropped first, so it isn't read as trigger 2. Anything else that reads as 2, 4b, 5 or 6 refuses.
              const t = r && r.replace(/\b\d+\s+(?:fresh\s+|blind\s+|external\s+)?reviewers?\b/gi, '');
              if (t && /\b(2|4b|5|6)\b/i.test(t)) return `its Review: line names ${r.replace(/^(?:[-*]\s+)?Review:\s*/i, '')}`;
              const l = labels.find((x) => x === 'hold' || x === 'fresh-review');
              if (l) return `it carries ${l}`;
              const f = files.find(SAVEKEY);
              return f ? `it changes ${f}` : '';
            };
            const namedBlocker = (comments, sha, prBody = '', implied = [], labels = [], files = []) => {
              const barred = prNoClear(prBody, labels, files);
              const s7 = sha.slice(0, 7);
              const rl = V.lines(prBody).find((l) => /^(?:[-*]\s+)?Review:/i.test(l));
              // A Review: line naming external or blind review needs a real FRESH REVIEW OK on the head: no REVIEW CLEAR stands in for
              // fresh review there; a stuck fresh reviewer goes to the coordinator, who takes it to the owner (coordinator, #705).
              const realFresh = !!rl && /\b(blind|external)\b/i.test(rl);
              const ev = [];
              for (const c of comments) {
                if (!c.user || !(c.user.login === 'claude[bot]' || c.user.login.toLowerCase() === owner.toLowerCase())) continue;
                const at = Date.parse(c.created_at || c.updated_at), names = (c.body || '').includes(s7);
                // Tagged verdicts, fresh notes and clears come from the owner account only: a bot review's text follows the PR's
                // content, so a tagged line in it could speak for a reviewer (Code Review, #686).
                const person = c.user.login.toLowerCase() === owner.toLowerCase();
                const t = person && V.tagged(c.body).pop();
                if (t) ev.push({ who: who(t.reviewer), ok: t.verdict !== 'CHANGES', head: t.line.includes(s7), at });
                const f = person && V.fresh(c.body);
                if (f) ev.push({ who: 'fresh review', ok: f === 'OK', head: V.freshOk(c.body).some((l) => l.includes(s7)), at });
                // DESIGN and Game Data Check marks too: from the owner account, unquoted (bot review nit on #686).
                const mine = person ? V.own(c.body).join('\n') : '';
                const d = V.design(mine);
                if (d) ev.push({ who: 'design lead', ok: d === 'OK', head: names, at });
                for (const x of V.data(mine)) ev.push({ who: 'game data check', ok: x.verdict === 'VERIFIED', head: sha.startsWith(x.sha), at });
                for (const k of person ? V.clears(c.body) : []) {
                  if (NOCLEAR.has(k.trigger)) { core.info(`REVIEW CLEAR for ${k.reviewer} refused: trigger ${k.trigger} never allows one`); continue; }
                  if (barred) { core.info(`REVIEW CLEAR for ${k.reviewer} refused: ${barred}`); continue; }
                  if (realFresh && who(k.reviewer) === 'fresh review') { core.info('REVIEW CLEAR for fresh review refused: the Review: line names external or blind review'); continue; }
                  core.notice(`REVIEW CLEAR for ${k.reviewer} (trigger ${k.trigger}): ${k.reason}`);
                  ev.push({ who: who(k.reviewer), ok: true, head: true, at, clear: true });
                }
              }
              const open = [];
              for (const who of new Set(ev.map((e) => e.who))) {
                const mine = ev.filter((e) => e.who === who);
                const lastNo = Math.max(...mine.filter((e) => !e.ok).map((e) => e.at));
                if (lastNo === -Infinity) continue;
                if (!mine.some((e) => e.ok && e.head && e.at > lastNo)) open.push(who);
              }
              if (open.length) return `CHANGES from ${open.join(', ')} not yet cleared by an approval naming ${s7}`;
              // A body "Review:" line naming fresh, blind or external review needs a FRESH REVIEW OK on the head, hold label or not
              // (#695 merged without one; Fresh governance review, 2026-10-21).
              const fresh = rl && /\b(fresh|blind|external)\b/i.test(rl) ? ['fresh review'] : [];
              const missing = [...new Set([...V.reviewers(prBody), ...implied, ...fresh].map(who))].filter((r) => !ev.some((e) => e.who === r && e.ok && e.head));
              return missing.length ? `waits on ${missing.join(', ')} to approve ${s7}` : '';
            };
            // NAMED-CHECK END
            // HOLD-CHECK START (tests/automerge.mjs runs this block)
            // Auto-merge adds and lifts `hold` itself (#709, owner OK 2026-10-21 9:37 AM ET: "auto-merge may add and lift hold per
            // #709"), so the Release Planner no longer lifts the holds auto-merge adds. A hold a person adds still needs a person to
            // lift it.
            // Add: a PR whose body Review: line names external or blind review gets hold while a review it needs is missing on
            // the head. A hold that was ever removed, by anyone, is never added back. A Reviewers: line alone adds none: the named
            // check already blocks the merge, and a hold would pause the pipeline review until the named reviewers approve, so a
            // fix it then asked for would make their approvals stale (Fresh governance review on #737).
            // Lift: only a hold auto-merge added itself (its last labeled event by github-actions[bot], and its marker comment
            // posted at or after that event, so another bot's later hold is not taken for its own).
            // A person's hold stays with people (Watchdog, planner judgment, interim holds such as #705's; Fresh governance review on
            // #737) unless its own HOLD line names a condition auto-merge can check (MRG-09 in gus.md, #744): the last line
            // `HOLD: <condition> (owner: <name>)`, on its own line in an owner-account comment posted at or after the last hold
            // labeled event, with <condition> one of the closed list FRESH REVIEW OK, DESIGN OK, Game Data Check VERIFIED or
            // VERDICT: APPROVE (reviewer: <name>), optionally "until …" and "… on head". That reviewer then joins the ones
            // namedBlocker requires, and the hold lifts when they all approve the head. Any other condition (free text) never
            // lifts; the owner does. The owner name is someone to ping, not a checked identity (every session posts as the owner
            // account). Auto-merge's own hold lifts only when ci-ok is green on the head and namedBlocker finds
            // nothing, with hold still counted so no REVIEW CLEAR stands in (prNoClear): a FRESH REVIEW OK on the head, plus every
            // Reviewers: name approving the head with no CHANGES left open. The pipeline APPROVE is not needed to lift: pipeline.yml
            // stops on hold, so a held PR never gets one. The merge loop asks for that review after the lift, and the merge still
            // needs its APPROVE.
            const AUTOHOLD = '<!-- auto-merge:auto-hold -->';
            const reviewLine = (body) => V.lines(body).find((l) => /^(?:[-*]\s+)?Review:/i.test(l)) || '';
            const blindOrExternal = (body) => /\b(blind|external)\b/i.test(reviewLine(body));
            const holdEvents = (events) => events.filter((e) => ['labeled', 'unlabeled'].includes(e.event) && e.label && e.label.name === 'hold');
            // '' = leave it; otherwise why hold is added. A PR whose reviews already approve the head gets no hold.
            const holdToAdd = (body, labels, events, blocker) => {
              if (labels.includes('hold') || holdEvents(events).some((e) => e.event === 'unlabeled') || !blocker) return '';
              return blindOrExternal(body) ? `its Review: line names ${reviewLine(body).replace(/^(?:[-*]\s+)?Review:\s*/i, '')}` : '';
            };
            // The last HOLD line a person posted for the current hold, or null: { cond, owner, reviewer } with reviewer null for a
            // condition outside the closed list. ownerLogin is the account sessions post as.
            const holdLine = (comments, events, ownerLogin) => {
              const added = holdEvents(events).filter((e) => e.event === 'labeled').pop();
              if (!added) return null;
              let found = null;
              const after = comments.filter((c) => c.user && c.user.login.toLowerCase() === ownerLogin.toLowerCase()
                && Date.parse(c.created_at) >= Date.parse(added.created_at)).sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
              for (const c of after) for (const h of V.holds(c.body)) found = h;
              return found;
            };
            // '' = lift; otherwise why hold stays. blocker is namedBlocker's result, or a function (extra reviewers) => that
            // result; line is holdLine()'s. A person's hold with a checkable HOLD line lifts only through the function, with the
            // line's reviewer added, so the condition itself is checked here and not left to the caller.
            const holdStays = (body, labels, events, comments, ciGreen, blocker, line = null) => {
              if (!labels.includes('hold')) return 'no hold';
              const added = holdEvents(events).filter((e) => e.event === 'labeled').pop();
              const mine = !!added && added.actor && added.actor.login === 'github-actions[bot]'
                && comments.some((c) => c.user && c.user.login === 'github-actions[bot]' && (c.body || '').includes(AUTOHOLD)
                  && Date.parse(c.created_at) >= Date.parse(added.created_at));
              if (!mine && !line) return 'hold stays with people: a person added it and posted no HOLD line';
              if (!mine && !line.reviewer) return `hold stays with ${line.owner}: its HOLD condition "${line.cond}" is not one auto-merge can check`;
              if (!ciGreen) return 'hold stays: ci-ok not green on the head';
              const extra = !mine && line.reviewer ? [line.reviewer] : [];
              if (extra.length && typeof blocker !== 'function') return `hold stays: cannot check ${line.reviewer}'s approval`;
              const b = typeof blocker === 'function' ? blocker(extra) : blocker;
              return b ? `hold stays: ${b}` : '';
            };
            // HOLD-CHECK END
            // FREEZE-CHECK START (tests/automerge.mjs runs this block)
            // Release freeze (owner OK 2026-10-20 1:35 PM ET, DECISIONS via #574): from Release Planner (Walter)'s RC READY until
            // CI's tag, only docs/**, ROADMAP.md and .github/ISSUE_TEMPLATE/** may merge, plus the release PR (its kickoff branch
            // claude/issue-<release issue>-*) and a PR labelled rc-blocker (a blocker fix RC PLAY DONE or DATA HOLD names). The
            // freeze is a line in #114, which Build Pipeline (Gus) writes on RC READY and removes at the tag:
            //   FREEZE: RC <sha> release #<n>
            const FREEZE = /^FREEZE: RC ([0-9a-f]{7,40}) release #(\d+)\b/m;
            const FREEZE_OK = (f) => /^docs\//.test(f) || f === 'ROADMAP.md' || /^\.github\/ISSUE_TEMPLATE\//.test(f);
            const freezeBlocker = (freeze, pr, files) => {
              if (!freeze) return '';
              const [, rc, rel] = freeze;
              if (new RegExp(`^claude/issue-${rel}-`).test(pr.head.ref)) return '';
              if (pr.labels.some((l) => l.name === 'rc-blocker')) return '';
              const out = files.filter((f) => !FREEZE_OK(f));
              return out.length ? `release freeze (RC ${rc.slice(0, 7)}, #114): changes ${out.slice(0, 3).join(', ')}${out.length > 3 ? ' …' : ''}` : '';
            };
            // FREEZE-CHECK END
            const freeze = ((await github.rest.issues.get({ owner, repo, issue_number: 114 })).data.body || '').match(FREEZE);
            if (freeze) core.notice(`Release freeze on (RC ${freeze[1].slice(0, 7)}, release #${freeze[2]})`);
            let merged = 0;
            const failed = [];
            for (const pr of prs) {
              const sha = pr.head.sha;
              const labels = pr.labels.map((l) => l.name);
              const runs = (await github.rest.checks.listForRef({ owner, repo, ref: sha, check_name: 'ci-ok', per_page: 50 })).data.check_runs;
              const ciGreen = runs.some((r) => r.status === 'completed' && r.conclusion === 'success');
              let comments = null, listed = null;
              const filesOf = async () => listed || (listed = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 }));
              // HOLD: add or lift it (HOLD-CHECK block). Only PRs that hold or a hold rule applies to read their label events.
              let lifted = false;
              if (labels.includes('hold') || blindOrExternal(pr.body || '')) {
                comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
                const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number: pr.number, per_page: 100 });
                const all = (await filesOf()).flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
                const imp = /^claude\/game-data-check-/.test(pr.head.ref) && all.some(DATAFILE) ? ['lydia'] : [];
                const blockerFor = (extra) => namedBlocker(comments, sha, pr.body || '', [...imp, ...extra], [...new Set([...labels, 'hold'])], all);
                const blocker = blockerFor([]);
                // A person's HOLD line with a checkable condition adds its reviewer to the ones the lift needs (MRG-09).
                const line = labels.includes('hold') ? holdLine(comments, events, owner) : null;
                const add = holdToAdd(pr.body || '', labels, events, blocker);
                if (add) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['hold'] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `${AUTOHOLD}\nAuto-merge added \`hold\` because ${add}. Still needed: ${blocker}. Auto-merge lifts the hold itself once those reviews name the head and ci-ok is green (#709).` });
                  core.notice(`#${pr.number}: hold added (${add}; ${blocker})`);
                  continue;
                }
                if (labels.includes('hold')) {
                  const stays = holdStays(pr.body || '', labels, events, comments, ciGreen, blockerFor, line);
                  if (stays) { core.info(`#${pr.number}: ${stays}`); continue; }
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'hold' });
                  const by = [...V.reviewers(pr.body || ''), ...imp, ...(line && line.reviewer ? [line.reviewer] : []), ...(/\b(fresh|blind|external)\b/i.test(reviewLine(pr.body || '')) ? ['fresh review'] : [])].map(who);
                  core.notice(`#${pr.number}: hold lifted: ${[...new Set(by)].join(', ')} approve ${sha.slice(0, 7)} and ci-ok is green (#709)`);
                  lifted = true;
                }
              }
              if (!ciGreen) { core.info(`#${pr.number}: ci-ok not green`); continue; }
              const commit = (await github.rest.repos.getCommit({ owner, repo, ref: sha })).data;
              const headAt = Date.parse(commit.commit.committer.date);
              comments = comments || await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              // Only the pipeline review's own form counts here ("Review of <sha7>" first, MRG-03); a named reviewer's tagged
              // APPROVE never stands in for it (incident fix 2026-10-20).
              const reviews = comments.filter((c) => c.user && c.user.login === 'claude[bot]' && V.reviewOf(c.body) && V.review(c.body))
                .sort((a, b) => Date.parse(a.updated_at) - Date.parse(b.updated_at));
              const last = reviews[reviews.length - 1];
              // A PR whose hold was just lifted never got its pipeline review (pipeline.yml stops on hold), and a label removed
              // with this workflow's token starts no workflow, so ask for the review here unless one already names the head.
              if (lifted && !(last && last.body.includes(sha.slice(0, 7)))) {
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pipeline.yml', ref: 'main', inputs: { pr: String(pr.number), step: 'review' } });
                core.notice(`#${pr.number}: pipeline review requested after the hold was lifted`);
                continue;
              }
              if (!last || V.review(last.body) !== 'APPROVE') { core.info(`#${pr.number}: no approving review`); continue; }
              if (Date.parse(last.updated_at) < headAt) { core.info(`#${pr.number}: approval older than the head commit`); continue; }
              if (!last.body.includes(sha.slice(0, 7))) { core.info(`#${pr.number}: approval does not name the head ${sha.slice(0, 7)}`); continue; }
              const files = (await filesOf()).map((f) => f.filename);
              // A rename out of data/ only shows its old path in previous_filename; the data check reads both.
              const touched = (await filesOf()).flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
              // Game Data Check's own data PRs skip DATA-CHECK, so a second data reviewer is required instead (MRG-12, #665).
              const implied = /^claude\/game-data-check-/.test(pr.head.ref) && touched.some(DATAFILE) ? ['lydia'] : [];
              const named = namedBlocker(comments, sha, pr.body || '', implied, labels.filter((l) => !lifted || l !== 'hold'), touched);
              if (named) { core.info(`#${pr.number}: ${named}`); continue; }
              const design = designBlocker(files, comments, sha, headAt);
              if (design) { core.info(`#${pr.number}: ${design}`); continue; }
              const data = await dataBlocker(pr, touched, comments, sha, headAt);
              if (data) { core.info(`#${pr.number}: ${data}`); continue; }
              const frozen = freezeBlocker(freeze, pr, touched);
              if (frozen) { core.info(`#${pr.number}: ${frozen}`); continue; }
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, sha, merge_method: 'squash' });
                core.notice(`Merged #${pr.number}`); merged++;
                // A merge made with this workflow's token doesn't close the issues the PR names ("Closes #N"): #135-#145
                // stayed open on 2026-10-16, and their kickoff "started" lines in #114 held slots. Close them here: every
                // "Closes/Fixes/Resolves #N" in the title or body, plus N of a kickoff branch claude/issue-N-<run>.
                const linked = [...`${pr.title}\n${pr.body || ''}`.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)].map((m) => +m[1]);
                const fromBranch = pr.head.ref.match(/^claude\/issue-(\d+)-/);
                if (fromBranch) linked.push(+fromBranch[1]);
                for (const n of [...new Set(linked)]) {
                  try {
                    if ((await github.rest.issues.get({ owner, repo, issue_number: n })).data.pull_request) { core.info(`#${n} is a PR; left open`); continue; }
                    await github.rest.issues.update({ owner, repo, issue_number: n, state: 'closed', state_reason: 'completed' }); core.info(`closed #${n}`); }
                  catch (e) { core.warning(`#${pr.number}: could not close #${n}: ${e.message}`); }
                }
              } catch (e) { core.error(`#${pr.number}: merge failed: ${e.message}`); failed.push(`#${pr.number}: ${e.message}`); }
            }
            if (merged) await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'ci.yml', ref: 'main' });
            // A ready PR that could not be merged turns this run red, so it shows up in the Actions list (before: a warning, run stayed green).
            if (failed.length) core.setFailed(`Ready PR(s) not merged: ${failed.join(' | ')}`);
      # A CI run on main that fails is re-run once (failed jobs only), so one flaky job doesn't leave main undeployed until someone looks.
      - name: Re-run failed main CI once
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: context.payload.workflow_run.id });
            core.notice(`Re-running failed jobs of CI run ${context.payload.workflow_run.id} on main (attempt 1 failed).`);
