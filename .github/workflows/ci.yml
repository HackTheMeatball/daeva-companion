name: CI

on:
  # Branch pushes run CI through their pull request only (no duplicate run per push); main runs on every push. Only a
  # release deploys (gate job below).
  push:
    branches: [main]
  pull_request:
  # On main, a dispatch with `sha` deploys that commit (gate job). Without it, it counts as a merge of main's HEAD (auto-merge
  # starts CI this way), so it deploys only when HEAD is a release commit. On a branch it runs the tests only.
  workflow_dispatch:
    inputs:
      sha:
        description: "Deploy this commit on main: a release commit (re-run or rollback), or any commit with now_comment"
        required: false
      now_comment:
        description: "Escape hatch only: id of the #114 comment holding DEPLOY NOW <sha7>: \"<Isaac's quote>\" (verified by id <id>)"
        required: false

permissions:
  contents: read

# One run per branch / PR. A newer push cancels an older run, except on main, where runs queue so a deploy is never cut off.
# Deploys are also serialized on their own "pages" group below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runner pinned (not ubuntu-latest) so an image change can't silently change test results; move it on purpose.
# Blocking jobs: data + every browser shard. ci-ok sums them up (the one required check); deploy needs it.
jobs:
  # Fast feedback on data and code (target < 2 min, no browser): JSON Schema validation of every v2 data file (ajv,
  # strict), the generator's cross-record checks, data/DATA_SOURCES.md current, the pure core in Node, the CHANGELOG
  # format, the CI shard list, and a build.
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Data format v2 (schemas, cross-record checks, DATA_SOURCES.md)
        run: node tests/schema.mjs
      - name: Generated data is current
        run: npm run gen:check
      - name: Pure core (Node)
        run: npm run test:core
      - name: CHANGELOG has an entry for this version
        run: node scripts/release-notes.mjs > /dev/null
      - name: Every blocking suite is in exactly one browser shard
        run: node tests/run.mjs --check-shards
      - name: Build both deliverables
        run: npm run build

  # The browser suites of tests/run.mjs, one job per shard (SHARDS in tests/run.mjs; the data job checks this list
  # matches). fail-fast off, so every shard reports.
  browser:
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [journey, regress, golden, checks]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/run.mjs --shard ${{ matrix.shard }}
      - name: Upload test output (logs, results.json, screenshots)
        if: always()
        # Non-blocking: a flaky artifact upload must not fail the shard (it did once, on main, and skipped the deploy).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.shard }}
          path: tests/out/
          retention-days: 7
          if-no-files-found: ignore

  # Non-blocking: update() < 15 ms (tests/perf.js). Wall-clock timing on a shared runner flakes, so a slow run is a
  # ::warning annotation, never a red check. Not in ci-ok; deploy doesn't wait for it.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - id: perf
        continue-on-error: true
        run: node tests/run.mjs --only perf --retries 0
      - name: Report
        if: always()
        run: |
          f=tests/out/perf/results.json
          if [ -f "$f" ]; then
            node -e 'const r=require("./"+process.argv[1]),s=r.map(x=>x.ms).sort((a,b)=>a-b),bad=r.filter(x=>!x.pass);console.log(`::notice title=perf::update() over ${r.length} states: median ${s[s.length>>1]} ms, max ${s[s.length-1]} ms`);for(const x of bad)console.log(`::warning title=perf (non-blocking)::${x.name}: ${x.ms} ms`)' "$f"
          fi
          if [ "${{ steps.perf.outcome }}" != "success" ]; then echo "::warning title=perf (non-blocking)::tests/perf.js failed (see the warnings above, or tests/out/perf.out); ci-ok does not depend on it."; fi
      - name: Upload perf output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-output-perf
          path: tests/out/
          retention-days: 7
          if-no-files-found: ignore

  # The one required check (branch protection on main requires `ci-ok`). Runs even when a needed job failed or was
  # cancelled (if: always()) and fails unless every blocking job succeeded; a skipped blocking job counts as a failure.
  ci-ok:
    if: always()
    needs: [data, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All blocking jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const n = JSON.parse(process.env.RESULTS), bad = Object.entries(n).filter(([, v]) => v.result !== "success");
            for (const [k, v] of Object.entries(n)) console.log(`${k}: ${v.result}`);
            if (!Object.keys(n).length) { console.log("::error title=ci-ok::no blocking jobs"); process.exit(1); }
            for (const [k, v] of bad) console.log(`::error title=ci-ok::${k} ${v.result}`);
            process.exit(bad.length ? 1 : 0);'

  # Starts kickoff.yml after a green run on main. Kickoff can't listen for this itself: main CI runs are dispatched by
  # auto-merge with GITHUB_TOKEN, and GitHub sends no workflow_run event for those, so kickoff never ran after a merge
  # (every run up to 2026-10-17 was a manual dispatch). A workflow_dispatch made with GITHUB_TOKEN does start a run.
  kickoff:
    needs: ci-ok
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'kickoff.yml', ref: 'main', inputs: { sha: context.sha } });

  # Deploy only on a release (PLN-17; Fresh governance review, deploy-cadence OK on Revision 1, 2026-10-21): a push to main
  # whose own diff changes package.json's version, or a dispatch that names a sha. Every other merge stops at ci-ok, so the
  # live site is always a release or a logged owner "now", never "main as it is" (0.9's save reset went live under 0.8.0).
  # - Push: deploy when the version at `before` differs from the pushed sha's. A `before` of all zeros counts as no change
  #   (a new branch or a force-push with no usable earlier sha: never a deploy on its own; dispatch at the release instead).
  # - Dispatch with no sha: auto-merge starts main CI this way after every merge (auto-merge.yml; a merge made with
  #   GITHUB_TOKEN sends no push event). It counts as that merge: deploy when the commit's own diff changes the version.
  # - Either of those, without a deploy, warns when the current version has no tag yet: its release never finished (a
  #   failed run, or a pending run cancelled by the next merge), so dispatch at the release commit named in the warning.
  # - Dispatch at a release commit (its version differs from its parent's): re-run of a failed release, or a rollback to an
  #   older release. No quote needed; the next merge never deploys a failed release.
  # - Dispatch at any other commit (the escape hatch, also for a legal remedy on Legal's ruling): needs now_comment, the id of
  #   a #114 comment with the line `DEPLOY NOW <sha7>: "<Isaac's quote>" (verified by id <id>)`. The coordinator reads
  #   Isaac's message by id first, and the thread that wants the deploy never dispatches it (two-person dispatch). The run
  #   lists the commits since the last tag and refuses when they change the save key or add a "Saves reset" CHANGELOG line,
  #   unless the quote says "save" or "reset". Every session posts as the owner account, so the comment is a trust marker:
  #   Watchdog (Mike) re-checks each quote by id and flags any deploy with neither a version change nor a logged quote.
  # A dispatch with a sha needs it on main with ci-ok green on it; deploy, smoke and release then all use that sha.
  gate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      checks: read
      issues: read
    outputs:
      deploy: ${{ steps.g.outputs.deploy }}
      own_ci: ${{ steps.g.outputs.own_ci }}
      sha: ${{ steps.g.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: g
        uses: actions/github-script@v7
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_NOW: ${{ inputs.now_comment }}
          BEFORE: ${{ github.event.before }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const git = (...a) => { try { return execFileSync('git', a, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim(); } catch (e) { return null; } };
            const versionAt = (ref) => { const t = git('show', `${ref}:package.json`); try { return t ? JSON.parse(t).version : null; } catch (e) { return null; } };
            // DEPLOY-GATE START (tests/deploy.mjs runs this block)
            const ZERO = /^0*$/;
            const nowLine = (sha) => new RegExp(`^DEPLOY NOW ${sha.slice(0, 7)}: "(.+)" \\(verified by id \\S+\\)\\s*$`, 'm');
            const decide = (x) => {
              if (x.event === 'push') {
                if (!x.before || ZERO.test(x.before)) return { deploy: false, why: 'push with no earlier sha: no version change' };
                return x.vBefore !== x.vSha ? { deploy: true, why: `version ${x.vBefore} -> ${x.vSha}` } : { deploy: false, why: `version unchanged (${x.vSha}): CI only` };
              }
              if (!x.sha) {
                if (x.vParent !== x.vSha) return { deploy: true, why: `merge of release ${x.vSha}` };
                return { deploy: false, why: `version unchanged (${x.vSha}): CI only` };
              }
              if (!x.onMain) return { refuse: `${x.sha} is not a commit on main` };
              if (!x.ciGreen) return { refuse: `ci-ok is not green on ${x.sha}` };
              if (x.vParent !== x.vSha) return { deploy: true, why: `release commit ${x.vSha} (re-run or rollback)` };
              if (!x.nowIs114) return { refuse: 'not a release commit: the escape hatch needs now_comment, a comment on #114' };
              const m = (x.nowBody || '').match(nowLine(x.sha));
              if (!m) return { refuse: `comment ${x.now} has no line DEPLOY NOW ${x.sha.slice(0, 7)}: "<quote>" (verified by id <id>)` };
              if (x.saveChange && !/\b(save|saves|reset)\b/i.test(m[1])) return { refuse: `the commits since ${x.lastTag} change the save key or add a "Saves reset" line, and the quoted "now" doesn't name it` };
              return { deploy: true, why: `escape hatch, owner's "now": "${m[1]}"` };
            };
            // A version with no tag after a run that didn't deploy: its release run never finished.
            const lost = (x, d) => (!d.deploy && !d.refuse && x.vSha && x.tagged === false
              ? `v${x.vSha} has no tag: its release never finished. Re-run it with a dispatch at ${x.relSha ? x.relSha.slice(0, 7) : 'the release commit'} (docs/DEPLOY.md).` : '');
            // DEPLOY-GATE END
            const ev = context.eventName, sha = ev === 'push' ? context.sha : git('rev-parse', '--verify', `${process.env.IN_SHA || ''}^{commit}`);
            const x = { event: ev, before: process.env.BEFORE, sha: ev === 'push' ? context.sha : (process.env.IN_SHA ? sha || process.env.IN_SHA : ''), now: process.env.IN_NOW };
            const own = ev === 'push' || !x.sha, at = own ? context.sha : sha;
            if (ev === 'push') { x.vBefore = versionAt(x.before); x.vSha = versionAt(x.sha); }
            else if (!x.sha) { x.vSha = versionAt(at); x.vParent = versionAt(`${at}^`); }
            if (own && x.vSha) {
              x.tagged = git('rev-parse', '-q', '--verify', `refs/tags/v${x.vSha}`) !== null;
              x.relSha = (git('log', '--reverse', '--format=%H', `-G"version": "${x.vSha}"`, at, '--', 'package.json') || '').split('\n')[0] || '';
            }
            if (!own) {
              x.onMain = !!sha && git('merge-base', '--is-ancestor', sha, 'origin/main') !== null;
              const runs = sha ? (await github.rest.checks.listForRef({ ...context.repo, ref: sha, check_name: 'ci-ok', per_page: 50 })).data.check_runs : [];
              x.ciGreen = runs.some((r) => r.status === 'completed' && r.conclusion === 'success');
              x.vSha = versionAt(sha); x.vParent = versionAt(`${sha}^`);
              x.lastTag = git('describe', '--tags', '--abbrev=0', '--match', 'v*', sha) || '';
              const range = x.lastTag ? `${x.lastTag}..${sha}` : sha;
              const commits = (git('log', '--format=%h %s', range) || '').split('\n').filter(Boolean);
              const srcDiff = git('diff', x.lastTag || `${sha}^`, sha, '--', 'src') || '', logDiff = git('diff', x.lastTag || `${sha}^`, sha, '--', 'CHANGELOG.md') || '';
              x.saveChange = /^[-+].*companion-save-v\d+/m.test(srcDiff) || /^\+.*Saves reset/m.test(logDiff);
              if (x.now) {
                try {
                  const c = (await github.rest.issues.getComment({ ...context.repo, comment_id: Number(x.now) })).data;
                  x.nowIs114 = /\/issues\/114$/.test(c.issue_url); x.nowBody = c.body;
                } catch (e) { core.warning(`now_comment ${x.now} unread: ${e.message}`); }
              }
              await core.summary.addHeading(`Commits since ${x.lastTag || 'the first commit'}`, 3).addList(commits.length ? commits : ['(none)']).write();
            }
            const d = decide(x);
            if (d.refuse) { core.setFailed(`Deploy refused: ${d.refuse}`); return; }
            core.notice(`${d.deploy ? 'Deploying' : 'Not deploying'} ${(x.sha || context.sha).slice(0, 7)}: ${d.why}`);
            const warn = lost(x, d);
            if (warn) core.warning(warn, { title: 'Release not live' });
            core.setOutput('deploy', String(d.deploy));
            core.setOutput('own_ci', String(own));
            core.setOutput('sha', x.sha || context.sha);

  deploy:
    needs: [data, browser, ci-ok, gate]
    # A push or a merge's dispatch (own_ci) deploys only after this run's ci-ok; a dispatch at a named sha's gate already
    # checked ci-ok on that sha. !cancelled(): a cancelled run never deploys.
    if: ${{ !cancelled() && needs.gate.outputs.deploy == 'true' && (needs.gate.outputs.own_ci != 'true' || needs.ci-ok.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      build_json: ${{ steps.build.outputs.build_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      # The build needs devDependencies (esbuild) since 0.2 step 2; browsers aren't needed to build.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Build
        id: build
        # build.json (one line of JSON) goes to the smoke job, which waits for the live site to serve it.
        run: |
          npm run build
          echo "build_json=$(tr -d '\n' < dist/build.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5

  # The live site must serve what deploy just built: polls /build.json (cache-busted, up to 5 min) until it equals
  # deploy's dist/build.json, then checks the footer shows package.json's version. A deploy that "succeeds" but never
  # goes live fails here, before a release is tagged. Failures are ::error annotations.
  smoke:
    needs: [gate, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Live site serves the deployed build and version
        env:
          EXPECTED_BUILD: ${{ needs.deploy.outputs.build_json }}
        run: node scripts/smoke.mjs --url https://daevacompanion.com --expect "$EXPECTED_BUILD" --timeout 300 --interval 10

  # A new version in package.json gets its tag and GitHub Release once it is tested and live (smoke passed). Notes come
  # from its CHANGELOG section. Versions already tagged are skipped, so ordinary pushes to main do nothing here.
  release:
    needs: [gate, deploy, smoke]
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag and publish new CHANGELOG versions; keep existing release notes in sync
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          # Each version is released at the first commit that set it in package.json (the current version at the deployed sha).
          cur="$(node -p 'require("./package.json").version')"
          for ver in $(node scripts/release-notes.mjs --list); do
            tag="v$ver"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # Released already: keep its title and notes in sync with CHANGELOG.md (edits only when they differ).
              node scripts/release-notes.mjs --version "$ver" > notes.md
              title="$(node scripts/release-notes.mjs --version "$ver" --title)"
              have_title="$(gh release view "$tag" --json name -q .name 2>/dev/null || true)"
              have_body="$(gh release view "$tag" --json body -q .body 2>/dev/null || true)"
              if [ "$have_title" != "$title" ] || [ "$(printf '%s' "$have_body" | tr -d '\r')" != "$(cat notes.md)" ]; then
                if out="$(gh release edit "$tag" --title "$title" --notes-file notes.md 2>&1)"; then
                  echo "::notice title=Updated $tag notes::$title"
                else
                  echo "::warning title=Could not update $tag notes::$(echo "$out" | tr '\n' ' ')"
                fi
              fi
              continue
            fi
            if [ "$ver" = "$cur" ]; then sha="$DEPLOY_SHA"; else
              sha="$(git log --reverse --format=%H -G"\"version\": \"$ver\"" -- package.json | head -1)"
            fi
            if [ -z "$sha" ]; then echo "::warning::No commit sets version $ver in package.json; not releasing it."; continue; fi
            node scripts/release-notes.mjs --version "$ver" > notes.md
            latest=false; [ "$ver" = "$cur" ] && latest=true
            # Failures are reported as annotations (readable without log access) with gh's own message.
            # A backfill (older version) only warns: GITHUB_TOKEN may not create a tag on a commit whose workflow files
            # differ from the current ones, so those need a one-time tag by a person. The current version must succeed.
            if ! out="$(gh release create "$tag" --target "$sha" \
                --title "$(node scripts/release-notes.mjs --version "$ver" --title)" \
                --notes-file notes.md --latest="$latest" 2>&1)"; then
              msg="$(echo "$out" | tr '\n' ' ')"
              if [ "$ver" = "$cur" ]; then echo "::error title=Release $tag failed::$msg"; exit 1; fi
              echo "::warning title=Backfill release $tag skipped::$msg"
              continue
            fi
            echo "::notice title=Released $tag::$out"
          done
