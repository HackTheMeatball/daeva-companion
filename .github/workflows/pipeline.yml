name: Pipeline
# Dispatched runs are named "Pipeline <step> #<pr>" so restart.yml can tell which PR and step a run was for.
run-name: "${{ inputs.pr && format('Pipeline {0} #{1}', inputs.step, inputs.pr) || 'Pipeline' }}"

# Owner request (2026-10-16, "smart mode"): move a claude/ PR to its next step the moment GitHub reports something,
# instead of waiting for the scheduled check-in. Every step here is mechanical; planning, releases and the tracker stay
# with the scheduled CEO task (state issue "CEO pipeline state").
#   - CI green on a PR's current head, and no review newer than the head  -> a review run (Opus since 2026-10-17; before that Sonnet, Opus for risky paths).
#   - CI red on the head: a blown time or size budget -> a fix run at once (PR #253); any other first failure -> re-run
#     the failed jobs once (no model); second failure -> a fix run.
#   - Latest claude[bot] review says VERDICT: CHANGES, a line-start DESIGN CHANGES (claude[bot] or owner account), or a Sonnet run said "Needs @claude (Opus)" -> a fix run.
#   - Dispatched with step=merge (kickoff does this after a merge, for a PR that conflicts with main or shares a
#     serial file with the merged diff) -> a run that merges main into the branch (merge commit), re-records golden only
#     if the merge needs it, runs npm test and pushes. Opus when golden/mig1 or risky paths are involved. Not a fix round;
#     at most one per PR per main commit.
#   - At most 3 fix rounds per PR (Sonnet, Opus, Opus since the 0.6 kaizen review K7; Opus from round 1 for risky paths). Then the PR gets the label
#     "stuck" and the pipeline leaves it to the CEO. A comment by the owner containing "pipeline:reset" restarts the count.
# A review counts for a head only if it names that head's short SHA ("Review of <sha7>"); a date check alone let a
# review of an older commit cover a newer one pushed later.
# Risky paths follow the routing rule (docs/team/DISPATCH.md): src/core/, save/storage/migration code, gate
# requires/completesWith, golden snapshots, the mig1 pin, tools/gen/, data/schema/, .github/, or > 300 changed lines.
# Label "opus" forces Opus; label "hold" or "stuck" stops this workflow for that PR. Merging stays with auto-merge.yml.
# Runs use the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), like claude.yml.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      step:
        description: review, fix, or merge (bring main into the branch; kickoff dispatches it after a merge)
        required: true
        default: review

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'claude/')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (github.event.comment.user.login == 'claude[bot]' ||
        (github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, 'DESIGN CHANGES'))))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      checks: read
    outputs:
      step: ${{ steps.d.outputs.step }}
      pr: ${{ steps.d.outputs.pr }}
      branch: ${{ steps.d.outputs.branch }}
      sha: ${{ steps.d.outputs.sha }}
      model: ${{ steps.d.outputs.model }}
      prompt: ${{ steps.d.outputs.prompt }}
      note: ${{ steps.d.outputs.note }}
    steps:
      - id: d
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ev = context.eventName, p = context.payload;
            const none = (why) => { core.info(`no step: ${why}`); core.setOutput('step', 'none'); };
            // How a bot run works in this sandbox (health check, 2026-10-17 4:26 PM ET, #222): compound commands are denied,
            // and the GitHub token dies 1 h after the run starts (P6 #198: 62 min, last push 401, run 39059180307).
            const TOOLS = 'Tools: one plain command per Bash call (no `&&`, `;`, pipes, heredocs, `python3 -`, scripts in /tmp, or env-var prefixes like `X=1 node ...`: they are denied; pass flags instead); create and edit files with Edit and Write.';
            const CLOCK = 'Clock: the GitHub token expires 1 hour after this run starts. Push after every commit, so nothing is lost; aim to finish by minute 45. If a push fails with 401 or "Bad credentials", stop at once: the run is restarted with a fresh token and continues from the pushed branch.';
            // Lines of a CI run's job logs that match re (failed jobs only, or all). A blown budget ("took longer than", a
            // hang guard, a build size limit) is deterministic, not a flake: a blind re-run let P15 merge on a lucky second try and main CI went red on the
            // same line (#221 7:18 PM ET, #222 7:38 PM ET, 2026-10-17).
            const BUDGET = /^(?!.*WARNING).*(took longer than|hang guard|is over the limit)/i; // time guards and size limits that failed (not WARNING lines, not the build's "budget …" report)
            const logLines = async (runId, failedOnly, re) => {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: runId, per_page: 100 });
              const found = [];
              for (const j of jobs.filter((x) => !failedOnly || x.conclusion === 'failure')) {
                const text = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: j.id })
                  .then((r) => (typeof r.data === 'string' ? r.data : Buffer.from(r.data).toString('utf8')), (e) => { core.warning(`log of job ${j.id}: ${e.status || e.message}`); return ''; });
                for (const l of text.split('\n')) if (re.test(l)) found.push(`${j.name}: ${l.replace(/^\S+Z /, '').trim().slice(0, 200)}`);
              }
              core.info(`logLines(run ${runId}${failedOnly ? ', failed jobs' : ''}): ${jobs.length} jobs, ${found.length} matching lines`);
              return [...new Set(found)].slice(0, 8);
            };
            let prNum, want, reason = '', reviewBody = null, ciRun = null;
            if (ev === 'workflow_run') {
              const wr = p.workflow_run;
              prNum = wr.pull_requests && wr.pull_requests[0] && wr.pull_requests[0].number;
              if (!prNum) {
                const open = (await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${wr.head_branch}` })).data;
                prNum = open[0] && open[0].number;
              }
              if (!prNum) return none(`no open PR for ${wr.head_branch}`);
              ciRun = wr.id;
              if (wr.conclusion === 'success') want = 'review';
              else if (wr.conclusion === 'failure') {
                const pr0 = (await github.rest.pulls.get({ owner, repo, pull_number: prNum })).data;
                if (pr0.head.sha !== wr.head_sha) return none('CI run is for an older head');
                const budget = wr.run_attempt === 1 ? await logLines(wr.id, true, BUDGET) : [];
                if (budget.length) {
                  want = 'fix'; reason = `CI failed on a budget (time or size), which a re-run doesn't fix: run ${wr.html_url}. ${budget.join(' / ')}. Make the slow suite do less or split it (or shrink the output); raise a budget only with a stated reason in the commit.`;
                } else if (wr.run_attempt === 1) {
                  await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: wr.id });
                  return none(`re-running failed jobs of CI run ${wr.id} once`);
                } else { want = 'fix'; reason = `CI failed twice on the head commit: run ${wr.html_url} (read the failed jobs with \`gh run view ${wr.id} --log-failed\`).`; }
              } else return none(`CI ${wr.conclusion}`);
            } else if (ev === 'issue_comment') {
              const body = p.comment.body || '';
              prNum = p.issue.number;
              const designAsk = `The Design Lead asked for changes: ${p.comment.html_url}. Fix every finding in it and re-take the after shots.`;
              // The Design Lead may post from the owner's account (auto-merge.yml accepts both); from it only DESIGN CHANGES counts.
              if (p.comment.user.login !== 'claude[bot]') {
                if (!/^DESIGN CHANGES\b/m.test(body)) return none('owner comment needs no step');
                want = 'fix'; reviewBody = body; reason = designAsk;
              } else if (/VERDICT:\s*CHANGES/.test(body)) { want = 'fix'; reviewBody = body; reason = `The latest review asked for changes: ${p.comment.html_url}. Fix every blocking finding in it.`; }
              else if (/^\s*Needs @claude \(Opus\):/m.test(body)) { want = 'fix'; reason = `A Sonnet run handed this to Opus: ${p.comment.html_url}.`; }
              // Design Lead's line-start DESIGN CHANGES (the gate auto-merge.yml reads) gets a fix run too (#424 had to be dispatched by hand).
              else if (/^DESIGN CHANGES\b/m.test(body)) { want = 'fix'; reviewBody = body; reason = designAsk; }
              else if (/^\s*Pipeline stuck:/m.test(body)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNum, labels: ['stuck'] });
                return none('a run reported it is stuck; labelled');
              } else return none('comment needs no step');
            } else {
              prNum = Number(p.inputs.pr); want = ['fix', 'merge'].includes(p.inputs.step) ? p.inputs.step : 'review';
              reason = 'Started by hand: read the latest review comment and the latest CI run on the head, and fix what they report.';
            }

            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNum })).data;
            let labels = pr.labels.map((l) => l.name);
            if (pr.state !== 'open' || pr.draft) return none('PR not open or draft');
            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}` || !/^claude\//.test(pr.head.ref)) return none('not a claude/ branch in this repo');
            // MRG-09 (Kaizen (Gale), 0.7 rules audit, 2026-10-19): a push made after `stuck` was added answers it (a session's
            // fix, or a merge of main), so CI on that head takes the label off and the PR moves on; #365 sat 56 min with its
            // findings fixed. `hold` is a person's stop and stays. A head that needs another fix round gets `stuck` back.
            if (ev === 'workflow_run' && labels.includes('stuck') && !labels.includes('hold')) {
              const events = await github.paginate(github.rest.issues.listEvents, { owner, repo, issue_number: prNum, per_page: 100 });
              const stuckAt = events.filter((e) => e.event === 'labeled' && e.label && e.label.name === 'stuck').map((e) => Date.parse(e.created_at)).pop();
              const pushedAt = Date.parse((await github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha })).data.commit.committer.date);
              if (stuckAt && pushedAt > stuckAt) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNum, name: 'stuck' });
                core.notice(`#${prNum}: head ${pr.head.sha.slice(0, 7)} was pushed after the stuck label; label removed (MRG-09)`);
                labels = labels.filter((l) => l !== 'stuck');
              }
            }
            if (labels.includes('hold') || labels.includes('stuck')) return none('labelled hold/stuck');
            if (ev === 'workflow_run' && pr.head.sha !== p.workflow_run.head_sha) return none('CI run is for an older head');

            const sha = pr.head.sha;
            if (reviewBody !== null && !reviewBody.includes(sha.slice(0, 7))) return none('the CHANGES review is of an older head');
            const headAt = Date.parse((await github.rest.repos.getCommit({ owner, repo, ref: sha })).data.commit.committer.date);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNum, per_page: 100 });
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNum, per_page: 100 });
            const changed = files.reduce((n, f) => n + f.additions + f.deletions, 0);
            const riskyPath = /^(src\/core\/|tools\/gen\/|data\/schema\/|tests\/golden|tests\/e2-migtest|\.github\/)/;
            const riskyPatch = /localStorage|migrat|\brequires\b|completesWith|mig1/;
            const risky = labels.includes('opus') || changed > 300
              || files.some((f) => riskyPath.test(f.filename) || ((/^src\/main\.js$|^data\//.test(f.filename)) && riskyPatch.test(f.patch || '')));

            // The Claude app can't push .github/workflows/ (no workflows permission): a bot fix or merge there is a wasted run.
            if (want !== 'review' && files.some((f) => /^\.github\/workflows\//.test(f.filename))) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNum, labels: ['stuck'] });
              await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body: 'Pipeline: this PR changes .github/workflows/, which the bots cannot push. Labelled `stuck`: a session with git push applies the fix.' });
              return none('workflow files: bots cannot push the fix');
            }
            if (want === 'merge') {
              // One merge run per PR per main commit: kickoff can dispatch again after the next merge.
              const main = (await github.rest.repos.getBranch({ owner, repo, branch: 'main' })).data.commit.sha.slice(0, 7);
              if (comments.some((c) => c.user && c.user.login === 'github-actions[bot]' && (c.body || '').includes(`<!-- pipeline:merge main=${main} `)))
                return none(`a merge run for main ${main} exists`);
              // Golden or the mig1 pin on either side (the PR, or main since the PR's base) may need a re-record: Opus.
              const mainFiles = (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${pr.base.sha}...main` })).data.files || [];
              const golden = [...files, ...mainFiles].some((f) => /^(tests\/golden|tests\/e2-migtest)/.test(f.filename) || /mig1/.test(f.patch || ''));
              const opus = risky || golden;
              core.setOutput('model', opus ? 'claude-opus-5-5' : 'claude-sonnet-5-5');
              core.setOutput('note', `<!-- pipeline:merge main=${main} -->\nPipeline: bringing main (${main}) into this branch (${opus ? 'Opus' : 'Sonnet'}), because it conflicts with main or shares a serial file with the last merge.`);
              core.setOutput('prompt', [
                `You update pull request #${prNum} in ${owner}/${repo}, branch ${pr.head.ref} (checked out), head commit ${sha}, with the current main (${main}).`,
                'Read CLAUDE.md first. Run `git fetch origin main` and `git merge origin/main` (a merge commit; never rebase, amend or force-push). Resolve conflicts keeping the intent of both sides.',
                'Re-record golden snapshots only if the golden suite fails because of the merge itself, and say in the commit which snapshots changed and why. Never skip, disable or weaken a test or check.',
                'Run commands in the foreground. Run `npm test` once at the end and make sure it is green, then `git push origin HEAD:' + pr.head.ref + '`. Do not write the word VERDICT in any comment, and start no line with DESIGN OK or DESIGN CHANGES.',
                'If the conflict needs a design or owner decision, do not push. Post one comment that starts with "Pipeline stuck:" and gives the reason in one or two lines.',
                TOOLS, CLOCK,
              ].join('\n'));
            } else if (want === 'review') {
              const ok = (await github.rest.checks.listForRef({ owner, repo, ref: sha, check_name: 'ci-ok' })).data.check_runs
                .some((r) => r.status === 'completed' && r.conclusion === 'success');
              if (!ok) return none('ci-ok not green on the head');
              const verdicts = comments.filter((c) => c.user && c.user.login === 'claude[bot]' && /VERDICT:\s*(APPROVE|CHANGES)/.test(c.body || ''));
              if (verdicts.some((c) => Date.parse(c.updated_at) >= headAt && (c.body || '').includes(sha.slice(0, 7)))) return none('a review of this head exists');
              // Reviews run on Opus since 2026-10-17 (owner's Max 20x plan); before that only risky PRs did.
              const model = 'claude-opus-5-5';
              const greenRun = ciRun || ((await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: sha, per_page: 20 })).data.workflow_runs.find((r) => r.name === 'CI' && r.conclusion === 'success') || {}).id;
              const warns = greenRun ? await logLines(greenRun, false, /^\S*\s*WARNING .*took longer than/) : [];
              core.setOutput('model', model);
              core.setOutput('prompt', [
                `You review pull request #${prNum} in ${owner}/${repo}, head commit ${sha}. CI (ci-ok) is green on this head, so do not run the test suites.`,
                `Read CLAUDE.md, then \`gh pr view ${prNum}\` and \`gh pr diff ${prNum}\`; open files in the checkout for context.`,
                'Check: correctness; the CLAUDE.md rules (verified data only with labels, the save rule, no weakened tests or checks, data in data/ not main.js, Sources card, licensing and "unofficial" text, both builds identical); missing tests for new behaviour.',
                `Then post exactly one comment with \`gh pr comment ${prNum} --body-file <file>\`: first line "Review of ${sha.slice(0, 7)}", then at most 12 short lines of findings, blocking ones first and marked BLOCKING.`,
                'The last line is `VERDICT: APPROVE` or `VERDICT: CHANGES`. Write the word VERDICT only on that last line, not even when quoting or describing another review (auto-merge ignores an APPROVE whose text also says VERDICT: CHANGES). Use CHANGES only for blocking problems; list nits and still APPROVE.',
                warns.length ? `CI on this head printed a time-budget warning: ${warns.join(' / ')}. A suite this close to its hang guard fails on main next, so it is BLOCKING when this PR adds to that suite's work (it changes the suite or the code it runs) unless the PR raises that budget with a stated reason; ask for the suite to do less or be split. If the PR doesn't touch it, list it as a nit saying main needs that fix.` : '',
                TOOLS,
              ].filter(Boolean).join('\n'));
            } else {
              let since = 0;
              // Only the owner can reset the count, and only this workflow's own markers count as rounds (public repo).
              for (const c of comments) if (c.user && c.user.login === owner && /pipeline:reset/.test(c.body || '')) since = Date.parse(c.created_at);
              const round = comments.filter((c) => c.user && c.user.login === 'github-actions[bot]' && Date.parse(c.created_at) > since
                && /<!-- pipeline:fix /.test(c.body || '')).length + 1;
              if (round > 3) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNum, labels: ['stuck'] });
                await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body: 'Pipeline: 3 fix rounds did not get this PR green and approved. Labelled `stuck` for the CEO check-in.' });
                return none('fix rounds used up; labelled stuck');
              }
              // Round 1 Sonnet, rounds 2-3 Opus (0.6 kaizen K7, #222: in 0.5 P7's two Sonnet rounds failed the same check).
              const opus = risky || round >= 2 || /Needs @claude \(Opus\)/.test(reason);
              const model = opus ? 'claude-opus-5-5' : 'claude-sonnet-5-5';
              core.setOutput('note', `<!-- pipeline:fix round=${round} -->\nPipeline: fix round ${round} of 3 on ${sha.slice(0, 7)} (${opus ? 'Opus' : 'Sonnet'}). ${reason}`);
              core.setOutput('model', model);
              core.setOutput('prompt', [
                `You fix pull request #${prNum} in ${owner}/${repo}, branch ${pr.head.ref} (checked out), head commit ${sha}.`,
                reason,
                'Read CLAUDE.md first and follow it. Find the root cause and fix it on this branch. Never skip, disable or weaken a test or check to get green; if an expectation must change on purpose, say why in the commit.',
                opus ? '' : 'Sonnet limits (owner routing rule): if the fix would touch src/core/, save/sync/migration/storage code, a gate\'s requires/completesWith, golden snapshots, the mig1 pin, or more than about 300 lines, do not edit. Post one comment starting "Needs @claude (Opus):" with the reason, then stop.',
                'Run commands in the foreground only (a background command can end the run early). Commit and push after each finished step. While iterating use `node tests/run.mjs --only <suites>` after `npm run build`, batch slow golden or pixel runs, and run the full `npm test` once at the end: it must be green before the last push.',
                `Commit with a clear message and push: \`git push origin HEAD:${pr.head.ref}\`. Then post one short comment with \`gh pr comment ${prNum}\` saying what you changed. Do not write the word VERDICT in it, and start no line with DESIGN OK or DESIGN CHANGES (auto-merge reads those as design marks).`,
                'If it cannot be fixed safely (unverifiable game data, an owner decision, an outside failure), do not push. Post one comment that starts with "Pipeline stuck:" and gives the reason in one or two lines.',
                TOOLS, CLOCK,
              ].filter(Boolean).join('\n'));
            }
            core.setOutput('step', want);
            core.setOutput('pr', String(prNum));
            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', sha);

  run:
    name: run (${{ needs.decide.outputs.model }})
    needs: decide
    if: contains(fromJSON('["review","fix","merge"]'), needs.decide.outputs.step)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: pipeline-pr-${{ needs.decide.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      # A queued run may be stale by the time it starts: skip it if the head moved (or, for a review, one now exists).
      - id: recheck
        uses: actions/github-script@v7
        env:
          PR: ${{ needs.decide.outputs.pr }}
          SHA: ${{ needs.decide.outputs.sha }}
          STEP: ${{ needs.decide.outputs.step }}
          NOTE: ${{ needs.decide.outputs.note }}
          ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR) })).data;
            let go = pr.state === 'open' && pr.head.sha === process.env.SHA;
            if (go && process.env.STEP === 'review') {
              const headAt = Date.parse((await github.rest.repos.getCommit({ owner, repo, ref: pr.head.sha })).data.commit.committer.date);
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              go = !comments.some((c) => c.user && c.user.login === 'claude[bot]' && /VERDICT:/.test(c.body || '')
                && Date.parse(c.updated_at) >= headAt && (c.body || '').includes(pr.head.sha.slice(0, 7)));
            }
            core.info(go ? 'still current' : 'stale, skipping');
            core.setOutput('go', String(go));
            // The fix-round (or merge) marker is written only once the run is known to go ahead, so a stale queued run uses no round.
            // A Restart re-run (attempt 2) of the same run reuses the marker it already posted, so no extra round.
            if (go && process.env.STEP !== 'review' && Number(process.env.ATTEMPT) === 1) await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: process.env.NOTE });
      - if: steps.recheck.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.branch }}
          # A merge run needs the history to find the merge base with main; a shallow head has none.
          fetch-depth: ${{ needs.decide.outputs.step == 'merge' && 0 || 1 }}
          # Not persisted: the action pushes as the Claude GitHub App, so its pushes trigger CI (see claude.yml).
          persist-credentials: false
      - if: steps.recheck.outputs.go == 'true' && needs.decide.outputs.step != 'review'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.recheck.outputs.go == 'true' && needs.decide.outputs.step != 'review'
        run: npm ci && npx playwright install --with-deps chromium
      - if: steps.recheck.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_BRANCH: ${{ needs.decide.outputs.branch }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ needs.decide.outputs.prompt }}
          # The CI run or review that started this was made by the Claude app or by this workflow, not a person.
          allowed_bots: "claude,github-actions"
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ needs.decide.outputs.model }}
            --max-turns 300
            --allowedTools "Bash(npm:*),Bash(node:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh run view:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(diff:*),Bash(sort:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Edit,Write,Read,Glob,Grep,WebFetch,WebSearch"
      # A fix or merge run that ends "success" with no push and no reason did nothing (PR #242 fix round 2, run 39063206690:
      # 7 permission denials, no push, no comment). Same check as kickoff's build: print the denials and fail, so
      # restart.yml re-runs it once (the re-run reuses this round's marker).
      - name: Check the run pushed or said why
        if: steps.recheck.outputs.go == 'true' && needs.decide.outputs.step != 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          SHA: ${{ needs.decide.outputs.sha }}
          STEP: ${{ needs.decide.outputs.step }}
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$out" ]; then
            jq -r '[.[] | select(.type == "result")] | last | "turns=\(.num_turns) denials=\(.permission_denials_count)",
              ((.permission_denials // [])[] | "denied: \(.tool_name) \(.tool_input | tostring | .[0:200])")' "$out" || true
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          said=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?since=$started&per_page=100" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length')
          echo "step=$STEP head before=$SHA now=$head; claude[bot] comments since $started: $said"
          if [ "$head" = "$SHA" ] && [ "$said" = 0 ]; then
            echo "::error::The $STEP run on #$PR ended with no push and no reason"
            exit 1
          fi
      # Auto-merge also reacts to the review comment itself; this dispatch is a backstop in case that event is missed.
      - if: steps.recheck.outputs.go == 'true' && needs.decide.outputs.step == 'review'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'auto-merge.yml', ref: 'main' });
